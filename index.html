<script type="module">

// ---------------------------------------------------------------

// ---------------------------------------------------------------
// 2. MOTEUR TARIFAIRE WOYOFAL (par categorie)
// Chiffres 2026 confirmes par Senelec pour Domestique Petite Puissance
// (grille tarifaire officielle + posts Woyofal). La redevance (429 F) n'est
// confirmee que pour le DPP - a verifier pour les autres categories.
// Taxe communale (2.5%) et TVA (18% au-dela de 250 kWh) sont des taxes
// generiques, appliquees ici a toutes les categories.
// ---------------------------------------------------------------
const TARIFS_PAR_CATEGORIE = {
  DPP: {
    label: "Domestique Petite Puissance (DPP)",
    redevanceMensuelle: 429,
    taxeCommunale: 0.025,
    tva: 0.18,
    tranches: [
      { max: 150, prix: 82.00 },
      { max: 250, prix: 136.49 },
      { max: null, prix: 136.49, tvaApplicable: true },
    ],
  },
  DMP: {
    label: "Domestique Moyenne Puissance (DMP)",
    redevanceMensuelle: 429,
    taxeCommunale: 0.025,
    tva: 0.18,
    tranches: [
      { max: 150, prix: 111.23 },
      { max: 250, prix: 143.54 },
      { max: null, prix: 143.54, tvaApplicable: true },
    ],
  },
  PPP: {
    label: "Professionnel Petite Puissance (PPP)",
    redevanceMensuelle: 429,
    taxeCommunale: 0.025,
    tva: 0.18,
    tranches: [
      { max: 150, prix: 147.43 },
      { max: 250, prix: 189.84 },
      { max: null, prix: 189.84, tvaApplicable: true },
    ],
  },
  PMP: {
    label: "Professionnel Moyenne Puissance (PMP)",
    redevanceMensuelle: 429,
    taxeCommunale: 0.025,
    tva: 0.18,
    tranches: [
      { max: 150, prix: 165.01 },
      { max: 250, prix: 191.01 },
      { max: null, prix: 191.01, tvaApplicable: true },
    ],
  },
};

let categorieTarifaire = "DPP";

function getTarifsActuels() {
  return TARIFS_PAR_CATEGORIE[categorieTarifaire] || TARIFS_PAR_CATEGORIE.DPP;
}

const CODES_UTILES = [
  { code: "800", label: "Consommation totale d'energie" },
  { code: "801", label: "Credit restant" },
  { code: "804", label: "Numero du compteur" },
  { code: "808", label: "Puissance instantanee" },
  { code: "809", label: "Verification usage" },
  { code: "810", label: "Valeur du decouvert" },
  { code: "811", label: "Credit d'urgence (a activer une fois a zero)" },
  { code: "812", label: "Desactivation de l'alarme sonore" },
  { code: "813", label: "Consommation de la journee precedente" },
  { code: "814", label: "Consommation d'energie du mois en cours" },
  { code: "815", label: "Date de la derniere recharge" },
  { code: "816", label: "Heure de la derniere recharge" },
  { code: "817", label: "Montant de la derniere recharge" },
  { code: "820", label: "Consommation du mois precedent" },
  { code: "830", label: "Code de la derniere recharge" },
];

function calculerKwh(montantFcfa, cumulDejaAchete, isPremierAchatDuMois, tarifs) {
  tarifs = tarifs || getTarifsActuels();
  const redevance = isPremierAchatDuMois ? tarifs.redevanceMensuelle : 0;
  let solde = montantFcfa - redevance;
  if (solde <= 0) return { kwh: 0, erreur: "montant_insuffisant", redevance: Math.round(redevance) };
  const taxeCommunaleMontant = solde * tarifs.taxeCommunale;
  solde = solde - taxeCommunaleMontant;

  let kwh = 0, remaining = solde, cum = cumulDejaAchete, guard = 0, tvaMontant = 0;
  for (const tranche of tarifs.tranches) {
    if (remaining <= 0.001 || guard++ > 20) break;
    const plafond = tranche.max === null ? Infinity : tranche.max;
    if (cum >= plafond) continue;
    const capacite = plafond - cum;
    const prixUnitaire = tranche.tvaApplicable ? tranche.prix * (1 + tarifs.tva) : tranche.prix;
    const coutCapacite = capacite === Infinity ? Infinity : capacite * prixUnitaire;
    let ajout, coutReel;
    if (coutCapacite !== Infinity && remaining >= coutCapacite) {
      ajout = capacite; coutReel = coutCapacite;
    } else {
      ajout = remaining / prixUnitaire; coutReel = remaining;
    }
    if (tranche.tvaApplicable) tvaMontant += coutReel - ajout * tranche.prix;
    kwh += ajout; cum += ajout; remaining -= coutReel;
  }
  return {
    kwh: Math.round(kwh * 100) / 100,
    cumulApres: Math.round(cum * 100) / 100,
    redevance: Math.round(redevance),
    taxeCommunaleMontant: Math.round(taxeCommunaleMontant),
    tvaMontant: Math.round(tvaMontant),
    erreur: null,
  };
}

function palierActuel(cumulKwh, tarifs) {
  tarifs = tarifs || getTarifsActuels();
  for (let i = 0; i < tarifs.tranches.length; i++) {
    const plafond = tarifs.tranches[i].max;
    if (plafond === null || cumulKwh < plafond) return i + 1;
  }
  return tarifs.tranches.length;
}

function kwhRestantAvantProchainPalier(cumulKwh, tarifs) {
  tarifs = tarifs || getTarifsActuels();
  const palier = palierActuel(cumulKwh, tarifs);
  const tranche = tarifs.tranches[palier - 1];
  if (tranche.max === null) return null;
  return Math.max(0, tranche.max - cumulKwh);
}

// ---------------------------------------------------------------
// 2b. OPTIMISEUR D'ACHAT MULTI-MOIS
// Chaque mois "frais" (a partir du 2e) repart a 0 kWh et redemande la
// redevance mensuelle - donc etaler n'est rentable que si l'acces a la
// tranche 1 (moins chere) du mois suivant compense ce cout fixe. Les
// deux fonctions ci-dessous remplissent les tranches disponibles par
// prix croissant (les moins cheres d'abord, tous mois confondus).
// ---------------------------------------------------------------
function genererSlotsMultiMois(nMois, cumulActuel, tarifs) {
  const slots = [];
  for (let m = 0; m < nMois; m++) {
    let cum = m === 0 ? cumulActuel : 0;
    for (const tranche of tarifs.tranches) {
      const plafond = tranche.max === null ? Infinity : tranche.max;
      if (cum >= plafond) continue;
      const capacite = plafond - cum;
      const prixUnitaire = tranche.tvaApplicable ? tranche.prix * (1 + tarifs.tva) : tranche.prix;
      slots.push({ mois: m, capacite, prixUnitaire });
      cum = plafond;
    }
  }
  slots.sort((a, b) => a.prixUnitaire - b.prixUnitaire);
  return slots;
}

function redevancesParMois(nMois, premierMoisEstPremier, tarifs) {
  const redevances = [];
  for (let m = 0; m < nMois; m++) {
    redevances.push((m === 0 ? premierMoisEstPremier : true) ? tarifs.redevanceMensuelle : 0);
  }
  return redevances;
}

// Budget fixe -> maximiser le kWh obtenu. La redevance d'un mois n'est
// prelevee que lorsqu'on achete reellement quelque chose dans ce mois -
// sinon etaler sur plus de mois serait toujours pire, meme quand ca
// n'aide pas (redevance payee pour rien).
function planifierParBudget(budget, nMois, cumulActuel, premierMoisEstPremier, tarifs) {
  tarifs = tarifs || getTarifsActuels();
  const redevances = redevancesParMois(nMois, premierMoisEstPremier, tarifs);
  const slots = genererSlotsMultiMois(nMois, cumulActuel, tarifs);
  const detail = Array.from({ length: nMois }, () => ({ montant: 0, kwh: 0 }));
  const redevancePayee = Array(nMois).fill(false);
  let budgetRestant = budget;
  let kwhTotal = 0;

  for (const slot of slots) {
    if (budgetRestant <= 0.01) break;
    const m = slot.mois;
    if (!redevancePayee[m]) {
      const r = redevances[m];
      if (budgetRestant < r) continue;
      budgetRestant -= r;
      detail[m].montant += r;
      redevancePayee[m] = true;
    }
    const netDispo = budgetRestant * (1 - tarifs.taxeCommunale);
    const coutNetSlotMax = slot.capacite === Infinity ? Infinity : slot.capacite * slot.prixUnitaire;
    let kwhAjoute, montantReelUtilise;
    if (coutNetSlotMax !== Infinity && netDispo >= coutNetSlotMax) {
      kwhAjoute = slot.capacite;
      montantReelUtilise = coutNetSlotMax / (1 - tarifs.taxeCommunale);
    } else {
      kwhAjoute = netDispo / slot.prixUnitaire;
      montantReelUtilise = budgetRestant;
    }
    detail[m].montant += montantReelUtilise;
    detail[m].kwh += kwhAjoute;
    kwhTotal += kwhAjoute;
    budgetRestant -= montantReelUtilise;
  }

  const detailFinal = detail.filter((d) => d.montant > 0).map((d) => ({
    montant: Math.round(d.montant), kwh: Math.round(d.kwh * 100) / 100,
  }));
  const redevanceTotale = redevances.reduce((a, b, i) => a + (redevancePayee[i] ? b : 0), 0);

  if (kwhTotal <= 0) return { erreur: "budget_insuffisant_redevances", redevanceTotale };
  return { kwhTotal: Math.round(kwhTotal * 100) / 100, redevanceTotale, detail: detailFinal, erreur: null };
}

// kWh cible -> minimiser le montant total. Meme principe : un mois qui ne
// sert a rien n'est jamais ouvert (sa redevance n'est jamais payee).
function planifierParKwh(kwhCible, nMois, cumulActuel, premierMoisEstPremier, tarifs) {
  tarifs = tarifs || getTarifsActuels();
  const redevances = redevancesParMois(nMois, premierMoisEstPremier, tarifs);
  const slots = genererSlotsMultiMois(nMois, cumulActuel, tarifs);
  const detail = Array.from({ length: nMois }, () => ({ montant: 0, kwh: 0 }));
  const redevancePayee = Array(nMois).fill(false);
  let kwhRestant = kwhCible;

  for (const slot of slots) {
    if (kwhRestant <= 0.001) break;
    const m = slot.mois;
    if (!redevancePayee[m]) {
      detail[m].montant += redevances[m];
      redevancePayee[m] = true;
    }
    const kwhPris = Math.min(kwhRestant, slot.capacite);
    const montantReel = (kwhPris * slot.prixUnitaire) / (1 - tarifs.taxeCommunale);
    detail[m].montant += montantReel;
    detail[m].kwh += kwhPris;
    kwhRestant -= kwhPris;
  }

  const detailFinal = detail.filter((d) => d.montant > 0).map((d) => ({
    montant: Math.round(d.montant), kwh: Math.round(d.kwh * 100) / 100,
  }));
  const redevanceTotale = redevances.reduce((a, b, i) => a + (redevancePayee[i] ? b : 0), 0);
  const montantTotal = detailFinal.reduce((s, d) => s + d.montant, 0);

  return { montantTotal, redevanceTotale, detail: detailFinal, erreur: null };
}

function toDate(d) {
  if (!d) return new Date(0);
  if (typeof d.toDate === "function") return d.toDate();
  return new Date(d);
}

function debutMois() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), 1);
}

function cumulMoisEnCours(achats) {
  const debut = debutMois();
  return achats.reduce((sum, a) => (toDate(a.date) >= debut ? sum + (a.kwh || 0) : sum), 0);
}

function estPremierAchatDuMois(achats) {
  const debut = debutMois();
  return !achats.some((a) => toDate(a.date) >= debut);
}

// ---------------------------------------------------------------
// 2b. PREVISIONS A PARTIR DES RELEVES
// Le rythme de conso (kWh/jour) se deduit de la baisse du solde entre deux
// releves, en tenant compte des achats survenus entre les deux (sinon un
// achat au milieu de l'intervalle fausserait completement le calcul).
// ---------------------------------------------------------------
function joursEntre(d1, d2) {
  return (toDate(d2) - toDate(d1)) / (1000 * 60 * 60 * 24);
}

function intervallesConsommation(releves, achats) {
  const RYTHME_MAX_PLAUSIBLE = 50; // kWh/jour - au-dela, c'est forcement une erreur de saisie
  // ou une ambiguite d'ordre achat/releve le meme jour (on ne suit que la date, pas l'heure).
  const sorted = [...releves].sort((a, b) => toDate(a.date) - toDate(b.date));
  const intervalles = [];
  for (let i = 0; i < sorted.length - 1; i++) {
    const debut = sorted[i];
    const fin = sorted[i + 1];
    const jours = joursEntre(debut.date, fin.date);
    if (jours <= 0) continue;
    const achatsEntre = achats
      .filter((a) => toDate(a.date) > toDate(debut.date) && toDate(a.date) <= toDate(fin.date))
      .reduce((s, a) => s + (a.kwh || 0), 0);
    const conso = debut.soldeKwh + achatsEntre - fin.soldeKwh;
    const tauxJournalier = conso / jours;
    intervalles.push({
      debut: debut.date, fin: fin.date, jours,
      conso, tauxJournalier,
      anomalie: conso < 0 || tauxJournalier > RYTHME_MAX_PLAUSIBLE,
    });
  }
  return intervalles;
}

function tauxMoyenJournalier(intervalles) {
  const valides = intervalles.filter((i) => !i.anomalie);
  const totalConso = valides.reduce((s, i) => s + i.conso, 0);
  const totalJours = valides.reduce((s, i) => s + i.jours, 0);
  return totalJours > 0 ? totalConso / totalJours : null;
}

function joursRestantsEtDate(releves, achats, taux) {
  if (!taux || taux <= 0 || releves.length === 0) return null;
  const sorted = [...releves].sort((a, b) => toDate(b.date) - toDate(a.date));
  const dernier = sorted[0];
  const maintenant = new Date();
  const joursDepuis = Math.max(0, joursEntre(dernier.date, maintenant));
  const achatsDepuis = achats
    .filter((a) => toDate(a.date) > toDate(dernier.date))
    .reduce((s, a) => s + (a.kwh || 0), 0);
  const soldeEstime = dernier.soldeKwh + achatsDepuis - taux * joursDepuis;
  const joursRestants = Math.max(0, soldeEstime / taux);
  const dateEstimee = new Date(maintenant.getTime() + joursRestants * 86400000);
  return { soldeEstime: Math.max(0, soldeEstime), joursRestants, dateEstimee };
}

function graphiqueConsommationSVG(intervalles) {
  if (intervalles.length < 2) {
    return `<p style="font-size:13px;color:var(--text-secondary);margin:0;">Ajoute encore un relevé pour voir l'evolution dans le temps (un seul intervalle ne donne rien a comparer).</p>`;
  }
  const derniers = intervalles.slice(-8);
  const maxTaux = Math.max(...derniers.map((i) => Math.max(0, i.tauxJournalier)), 0.1);
  const width = 300, height = 90, barWidth = width / derniers.length;
  const bars = derniers.map((iv, idx) => {
    const h = Math.max(2, (Math.max(0, iv.tauxJournalier) / maxTaux) * (height - 22));
    const x = idx * barWidth + barWidth * 0.15;
    const w = barWidth * 0.7;
    const y = height - h - 16;
    const color = iv.anomalie ? "#B23A2A" : "#1B3A52";
    const label = toDate(iv.fin).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}" rx="2"></rect>
      <text x="${x + w / 2}" y="${height - 4}" font-size="9" fill="#8A9199" text-anchor="middle">${label}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;">${bars}</svg>`;
}

// Deplace les anciennes donnees "a plat" (users/{uid}/achats, /releves) vers
// un premier compteur "Compteur 1", si ce n'est pas deja fait. Ne s'execute
// qu'une fois par compte (ne fait rien si des compteurs existent deja).
async function migrerVersMultiCompteurs(uid) {
  const compteursSnap = await getDocs(collection(db, "users", uid, "compteurs"));
  if (!compteursSnap.empty) return;

  const userSnap = await getDoc(doc(db, "users", uid));
  const ancienneCategorie = (userSnap.exists() && userSnap.data().categorieTarifaire) || "DPP";

  const nouveauCompteurRef = await addDoc(collection(db, "users", uid, "compteurs"), {
    nom: "Compteur 1",
    categorieTarifaire: ancienneCategorie,
    createdAt: Timestamp.now(),
  });
  const compteurId = nouveauCompteurRef.id;

  const anciensAchats = await getDocs(collection(db, "users", uid, "achats"));
  for (const d of anciensAchats.docs) {
    await setDoc(doc(db, "users", uid, "compteurs", compteurId, "achats", d.id), d.data());
  }
  const anciensReleves = await getDocs(collection(db, "users", uid, "releves"));
  for (const d of anciensReleves.docs) {
    await setDoc(doc(db, "users", uid, "compteurs", compteurId, "releves", d.id), d.data());
  }

  await setDoc(doc(db, "users", uid), { compteurActifId: compteurId }, { merge: true });
}

function listenCompteurs(uid) {
  unsubCompteurs = onSnapshot(collection(db, "users", uid, "compteurs"), (snap) => {
    compteurs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    mettreAJourCategorieActuelle();
    render();
    if (compteursModalOuvert) renderCompteursListe();
  });
}

function activerListenersCompteur(uid, compteurId) {
  if (unsubAchats) unsubAchats();
  if (unsubReleves) unsubReleves();
  achats = []; releves = [];
  listenAchats(uid, compteurId);
  listenReleves(uid, compteurId);
}

async function switcherCompteur(id) {
  if (!currentUser || id === compteurActifId) return;
  compteurActifId = id;
  await setDoc(doc(db, "users", currentUser.uid), { compteurActifId: id }, { merge: true });
  mettreAJourCategorieActuelle();
  activerListenersCompteur(currentUser.uid, id);
  render();
}

async function ajouterCompteur(uid, nom, categorie) {
  const ref = await addDoc(collection(db, "users", uid, "compteurs"), {
    nom, categorieTarifaire: categorie, createdAt: Timestamp.now(),

  return ref.id;
}

async function supprimerCompteur(uid, id) {
  const achatsSnap = await getDocs(collection(db, "users", uid, "compteurs", id, "achats"));
  for (const d of achatsSnap.docs) await deleteDoc(d.ref);
  const relevesSnap = await getDocs(collection(db, "users", uid, "compteurs", id, "releves"));
  for (const d of relevesSnap.docs) await deleteDoc(d.ref);
  await deleteDoc(doc(db, "users", uid, "compteurs", id));
}

function listenAchats(uid, compteurId) {
  const q = query(collection(db, "users", uid, "compteurs", compteurId, "achats"), orderBy("date", "desc"));

function listenReleves(uid, compteurId) {

function fmtDateHeure(d) {
  return toDate(d).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function datetimeLocalStr(date) {
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}
function nowLocalDatetimeStr() {
  return datetimeLocalStr(new Date());
}

// Les champs montant sont formates avec separateur de milliers au blur
// (jamais pendant la frappe - trop de risques de curseur qui saute).
// parseMontant retire ces espaces avant de convertir en nombre.
function parseMontant(str) {
  return parseFloat(String(str).replace(/[\s\u00A0\u202F]/g, "").replace(",", "."));
}
function formatMontantInput(input) {
  const num = parseMontant(input.value);
  if (!isNaN(num) && num > 0) {
    input.value = num.toLocaleString("fr-FR");
  }
}

// sur toutes les cartes-statistiques du tableau de bord.
const ICONS = {
  wallet: '<path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v3"></path><path d="M3 7v10a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1H6a2 2 0 0 1-2-2z"></path><circle cx="16" cy="14" r="1.4" fill="currentColor" stroke="none"></circle>',
  coin: '<circle cx="12" cy="12" r="9"></circle><path d="M9 9.5a2.6 2 0 0 1 3-1.8c1.5.3 2 1.3 2 2.1 0 2-4 1.5-4 3.6 0 1 1 1.8 2.5 1.8s2.5-.6 2.5-1.6"></path><path d="M12 6.5v1M12 16v1"></path>',
  gauge: '<path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4-6"></path><circle cx="12" cy="17" r="1.3" fill="currentColor" stroke="none"></circle>',
  bolt: '<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" fill="currentColor" stroke="none"></path>',
  clock: '<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path>',
  refresh: '<path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v4h4"></path>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path>',
  chart: '<path d="M3 3v18h18"></path><path d="M7 15l4-6 3 3 5-8"></path>',
};

function statHead(iconKey, label, color) {
  color = color || "var(--text-muted)";
  return `<div style="display:flex;align-items:center;gap:5px;margin-bottom:7px;color:${color};">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[iconKey]}</svg>
    <span style="font-size:10px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;">${label}</span>
  </div>`;
}

function statValue(value, unit, color) {
  color = color || "var(--text-primary)";
  return `<p style="margin:0;font-variant-numeric:tabular-nums;"><span style="font-size:20px;font-weight:700;color:${color};">${value}</span>${unit ? ` <span style="font-size:12px;color:var(--text-muted);">${unit}</span>` : ""}</p>`;
}

function detailAchatHtml(redevance, taxeCommunaleMontant, tvaMontant, kwh) {
  const lignes = [];
  if (redevance > 0) lignes.push(["Redevance (1er achat du mois)", redevance]);
  if (taxeCommunaleMontant > 0) lignes.push(["Taxe communale (2,5%)", taxeCommunaleMontant]);
  if (tvaMontant > 0) lignes.push(["TVA (18%, au-dela de 250 kWh)", tvaMontant]);
  return `
    <div style="background:var(--bg);border-radius:8px;padding:12px;">
      ${lignes.map(([label, montant]) => `
        <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-secondary);padding:3px 0;">
          <span>${label}</span><span>${montant.toLocaleString("fr-FR")} F</span>
        </div>
      `).join("")}
      ${lignes.length ? `<div style="height:1px;background:var(--border);margin:6px 0;"></div>` : ""}
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-primary);font-weight:600;padding:3px 0;">
        <span>Converti en energie</span><span>${kwh} kWh</span>
      </div>
    </div>
  `;
}

function renderDashboard() {
  const cumul = cumulMoisEnCours(achats);
  const palier = palierActuel(cumul);
  const restant = kwhRestantAvantProchainPalier(cumul);
  const dernierReleve = releves[0];
  const debut = debutMois();
  const achatsDuMois = achats.filter((a) => toDate(a.date) >= debut);
  const totalMontant = achatsDuMois.reduce((s, a) => s + (a.montant || 0), 0);
  const totalKwh = achatsDuMois.reduce((s, a) => s + (a.kwh || 0), 0);
  const coutMoyen = totalKwh > 0 ? (totalMontant / totalKwh).toFixed(0) : null;

  const intervalles = intervallesConsommation(releves, achats);
  const taux = tauxMoyenJournalier(intervalles);
  const prevision = joursRestantsEtDate(releves, achats, taux);
  const aAnomalie = intervalles.some((i) => i.anomalie);

  const t1max = getTarifsActuels().tranches[0].max;
  const t2max = getTarifsActuels().tranches[1].max;
  const jaugeMax = t2max + 60;
  const markerPct = Math.min(100, (cumul / jaugeMax) * 100);
  const style = PALIER_STYLE[palier];

  tabContent.innerHTML = `
    <div class="grid" style="margin-bottom:20px;">
      <div class="card" style="background:${style.bg};border-color:transparent;">
        ${statHead("wallet", "kWh achetes ce mois", style.text)}
        ${statValue(cumul.toFixed(1), "kWh", style.text)}
        <p style="font-size:11px;margin:6px 0 0;color:${style.text};">${style.label}</p>
      </div>
      <div class="card">
        ${statHead("coin", "Cout moyen / kWh")}
        ${statValue(coutMoyen ? coutMoyen : "-", coutMoyen ? "F" : "")}
      </div>
      <div class="card">
        ${statHead("gauge", "Solde compteur")}
        ${prevision
          ? `${statValue(Math.round(prevision.soldeEstime * 10) / 10, "kWh")}<p style="font-size:11px;margin:6px 0 0;color:var(--text-muted);">Estime (achats inclus)</p>`
          : dernierReleve
            ? `${statValue(dernierReleve.soldeKwh, "kWh")}<p style="font-size:11px;margin:6px 0 0;color:var(--text-muted);">Dernier releve</p>`
            : statValue("-", "")
        }
      </div>
    </div>

    <div style="margin-bottom:20px;">
      <div style="position:relative;height:16px;border-radius:8px;background:#E9E7E0;overflow:hidden;margin-bottom:8px;">
        <div style="position:absolute;left:0;top:0;bottom:0;width:${markerPct}%;background:${palier === 1 ? "#1E6B3C" : palier === 2 ? "#C9820F" : "#B23A2A"};border-radius:8px;"></div>
        <div style="position:absolute;left:${(t1max / jaugeMax) * 100}%;top:0;bottom:0;width:1px;background:var(--bg);"></div>
        <div style="position:absolute;left:${(t2max / jaugeMax) * 100}%;top:0;bottom:0;width:1px;background:var(--bg);"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;">
        <span style="font-weight:600;color:${style.text};">${cumul.toFixed(1)} kWh</span>
        <span style="color:var(--text-muted);">${restant !== null ? Math.round(restant) + " kWh avant la tranche " + (palier + 1) : style.label}</span>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <p style="font-size:14px;font-weight:600;margin:0 0 12px;">Previsions</p>
      ${releves.length < 2
        ? `<p style="font-size:13px;color:var(--text-secondary);margin:0;">Ajoute au moins 2 releves espaces dans le temps (onglet Releves) pour activer les previsions.</p>`
        : `
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;margin-bottom:16px;">
            <div style="padding:0 12px 0 0;border-right:1px solid var(--border);">
              ${statHead("bolt", "Rythme moyen")}
              ${statValue(taux !== null ? taux.toFixed(2) : "-", taux !== null ? "kWh/j" : "")}
            </div>
            <div style="padding:0 12px;border-right:1px solid var(--border);">
              ${statHead("clock", "Jours restants")}
              ${statValue(prevision ? Math.round(prevision.joursRestants) : "-", prevision ? "j" : "")}
            </div>
            <div style="padding:0 0 0 12px;">
              ${statHead("calendar", "A sec le")}
              ${statValue(prevision ? prevision.dateEstimee.toLocaleDateString("fr-FR") : "-", "", prevision ? "var(--danger-text)" : undefined)}
            </div>
          </div>
          <div style="height:1px;background:var(--border);margin:0 0 14px;"></div>
          ${statHead("chart", "Conso par periode (kWh/j)")}
          ${graphiqueConsommationSVG(intervalles)}
          ${aAnomalie ? `<p style="font-size:12px;color:var(--danger-text);margin:8px 0 0;">Une periode en rouge signale un rythme incoherent (negatif ou irrealiste) sur cette periode - souvent un achat et un releve enregistres le meme jour dans le mauvais ordre. Cet intervalle est exclu du rythme moyen.</p>` : ""}
        `
      }
    </div>

    <div class="card">
      <p style="font-size:14px;font-weight:600;margin:0 0 12px;">Optimiseur d'achat</p>
      <div style="display:flex;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:14px;">
        <button id="opt-mode-budget" style="flex:1;text-align:center;padding:7px;font-size:12.5px;border:none;border-radius:6px;background:var(--surface);font-weight:600;color:var(--text-primary);">Mon budget</button>
        <button id="opt-mode-kwh" style="flex:1;text-align:center;padding:7px;font-size:12.5px;border:none;border-radius:6px;background:none;color:var(--text-muted);font-weight:400;">Mon besoin en kWh</button>
      </div>

      <div style="background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:12px;color:var(--text-secondary);">Rythme utilise : <strong id="opt-rythme-valeur" style="color:var(--text-primary);">-</strong></span>
          <span id="opt-rythme-source" style="font-size:11px;color:var(--text-muted);"></span>
        </div>
        <p style="font-size:11px;color:var(--text-muted);margin:0 0 6px;">Affiner avec ta conso du mois en cours (code 814)</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div><p style="font-size:10.5px;color:var(--text-muted);margin:0 0 3px;">Conso (kWh)</p><input type="text" inputmode="decimal" id="opt-conso814" placeholder="Ex: 45" /></div>
          <div><p style="font-size:10.5px;color:var(--text-muted);margin:0 0 3px;">Relevee le</p><input type="date" id="opt-date814" value="${todayStr()}" /></div>
        </div>
        <p id="opt-rythme-note" style="font-size:11px;margin:6px 0 0;display:none;"></p>
      </div>

      <p id="opt-label" style="font-size:12px;color:var(--text-muted);margin:0 0 4px;">Combien veux-tu depenser au total ?</p>
      <p style="font-size:11.5px;color:var(--text-muted);margin:0 0 8px;">${estPremierAchatDuMois(achats) ? "Ce serait ton 1er achat du mois (redevance appliquee)." : "Redevance deja payee ce mois-ci."}</p>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <input type="text" inputmode="decimal" id="opt-input" placeholder="Montant en FCFA" style="flex:1;" />
        <button class="accent" id="opt-btn">Comparer</button>
      </div>
      <div id="opt-result"></div>
    </div>
  `;

  // --- Optimiseur d'achat ---
  let optMode = "budget";
  const optModeBudgetBtn = document.getElementById("opt-mode-budget");
  const optModeKwhBtn = document.getElementById("opt-mode-kwh");
  const optLabelEl = document.getElementById("opt-label");
  const optInputEl = document.getElementById("opt-input");
  const optResultEl = document.getElementById("opt-result");
  const optConso814El = document.getElementById("opt-conso814");
  const optDate814El = document.getElementById("opt-date814");
  const optRythmeValeurEl = document.getElementById("opt-rythme-valeur");
  const optRythmeSourceEl = document.getElementById("opt-rythme-source");
  const optRythmeNoteEl = document.getElementById("opt-rythme-note");

  function majModeOptimiseur() {
    const surBudget = optMode === "budget";
    optModeBudgetBtn.style.background = surBudget ? "var(--surface)" : "none";
    optModeBudgetBtn.style.fontWeight = surBudget ? "600" : "400";
    optModeBudgetBtn.style.color = surBudget ? "var(--text-primary)" : "var(--text-muted)";
    optModeKwhBtn.style.background = surBudget ? "none" : "var(--surface)";
    optModeKwhBtn.style.fontWeight = surBudget ? "400" : "600";
    optModeKwhBtn.style.color = surBudget ? "var(--text-muted)" : "var(--text-primary)";
    optLabelEl.textContent = surBudget ? "Combien veux-tu depenser au total ?" : "De combien de kWh as-tu besoin au total ?";
    optInputEl.placeholder = surBudget ? "Montant en FCFA" : "kWh souhaites";
    optInputEl.value = "";
    optResultEl.innerHTML = "";
  }

  optModeBudgetBtn.addEventListener("click", () => { optMode = "budget"; majModeOptimiseur(); });
  optModeKwhBtn.addEventListener("click", () => { optMode = "kwh"; majModeOptimiseur(); });
  optInputEl.addEventListener("input", () => { optResultEl.innerHTML = ""; });

  function calculerTauxEffectif() {
    const conso = parseMontant(optConso814El.value);
    const dateStr = optDate814El.value;
    if (conso > 0 && dateStr) {
      const jours = joursEntre(debutMois(), new Date(dateStr));
      if (jours > 0) return { taux: conso / jours, source: "814", jours };
    }
    return { taux: taux, source: taux !== null ? "calcule" : null, jours: null };
  }

  function majAffichageRythme() {
    const r = calculerTauxEffectif();
    optRythmeValeurEl.textContent = r.taux !== null ? r.taux.toFixed(2) + " kWh/j" : "-";
    optRythmeSourceEl.textContent = r.taux === null ? "" : (r.source === "814" ? "via code 814" : "calcule");
    if (r.taux === null) {
      optRythmeNoteEl.style.display = "block";
      optRythmeNoteEl.style.color = "var(--text-muted)";
      optRythmeNoteEl.textContent = "Aucun rythme connu pour l'instant - renseigne ta conso du mois en cours ci-dessus pour comparer en jours.";
    } else if (r.source === "814" && r.jours < 3) {
      optRythmeNoteEl.style.display = "block";
      optRythmeNoteEl.style.color = "var(--warning-text)";
      optRythmeNoteEl.textContent = "Peu de jours ecoules ce mois-ci - ce rythme reste approximatif.";
    } else {
      optRythmeNoteEl.style.display = "none";
    }
  }
  majAffichageRythme();
  optConso814El.addEventListener("input", majAffichageRythme);
  optDate814El.addEventListener("change", majAffichageRythme);

  function rendreOptionOptimiseur(titre, badgeAchats, estMeilleure, headline, sousTexte, detail, insuffisant, extra) {
    const bg = estMeilleure ? "var(--success-bg)" : "var(--surface)";
    const borderCol = estMeilleure ? "transparent" : "var(--border)";
    const couleur = estMeilleure ? "var(--success-text)" : "var(--text-primary)";
    if (insuffisant) {
      return `<div class="card" style="border-color:var(--border);margin-bottom:10px;padding:14px;"><p style="font-size:13px;color:var(--text-muted);margin:0;">${titre} : montant insuffisant pour couvrir les redevances de ${badgeAchats.toLowerCase()}.</p></div>`;
    }
    const detailHtml = detail.length > 1 ? detail.map((d, i) => `
      <div style="background:var(--surface);border-radius:8px;padding:10px 12px;margin-top:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-primary);margin-bottom:2px;">
          <span style="font-weight:600;">${i === 0 ? "Achat 1 - maintenant" : "Achat " + (i + 1) + " - mois +" + i}</span>
          <span style="font-weight:600;">${d.montant.toLocaleString("fr-FR")} F</span>
        </div>
        <p style="font-size:11.5px;color:var(--text-muted);margin:0;">${d.kwh} kWh</p>
      </div>
    `).join("") : "";
    const extraHtml = extra ? `
      <div style="margin-top:10px;">
        <span style="display:inline-block;background:var(--surface);color:${extra.palierText};font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;">${extra.palierLabel}</span>
        <p style="font-size:12px;color:${couleur};margin:6px 0 0;">Cumul apres achat : <strong>${extra.cumulApres} kWh</strong></p>
      </div>
    ` : "";
    return `
      <div style="border:1px solid ${borderCol};border-radius:10px;padding:14px;margin-bottom:10px;background:${bg};">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:13px;font-weight:600;color:${couleur};">${titre}</span>
          <span style="font-size:11px;color:${estMeilleure ? couleur : "var(--text-muted)"};">${badgeAchats}</span>
        </div>
        <p style="font-size:20px;font-weight:700;margin:6px 0 ${sousTexte ? "4px" : "0"};color:${couleur};">${headline}</p>
        ${sousTexte ? `<p style="font-size:12px;color:${couleur};margin:0;">${sousTexte}</p>` : ""}
        ${extraHtml}
        ${detailHtml}
      </div>
    `;
  }

  document.getElementById("opt-btn").addEventListener("click", () => {
    const val = parseMontant(optInputEl.value);
    if (!val || val <= 0) {
      optResultEl.innerHTML = `<p style="font-size:13px;color:var(--danger-text);margin:0;">Entre une valeur valide.</p>`;
      return;
    }
    const tarifsActuels = getTarifsActuels();
    const premier = estPremierAchatDuMois(achats);
    const titres = ["Tout maintenant", "Etale sur 2 mois", "Etale sur 3 mois"];
    const badges = ["1 achat", "2 achats", "3 achats"];
    const rythmeInfo = calculerTauxEffectif();
    const tauxEffectif = rythmeInfo.taux;

    const resultats = [1, 2, 3].map((n) =>
      optMode === "budget"
        ? planifierParBudget(val, n, cumul, premier, tarifsActuels)
        : planifierParKwh(val, n, cumul, premier, tarifsActuels)
    );

    let meilleurIndex = 0;
    resultats.forEach((r, i) => {
      if (r.erreur) return;
      if (optMode === "budget") {
        if (resultats[meilleurIndex].erreur || r.kwhTotal > resultats[meilleurIndex].kwhTotal) meilleurIndex = i;
      } else {
        if (resultats[meilleurIndex].erreur || r.montantTotal < resultats[meilleurIndex].montantTotal) meilleurIndex = i;
      }
    });

    let html = "";
    resultats.forEach((r, i) => {
      if (r.erreur) {
        html += rendreOptionOptimiseur(titres[i], badges[i], false, "", "", [], true);
        return;
      }
      let headline, sousTexte = null, extra = null;
      if (optMode === "budget") {
        headline = tauxEffectif ? Math.round(r.kwhTotal / tauxEffectif) + " jours" : r.kwhTotal + " kWh";
        if (i > 0 && !resultats[0].erreur) {
          const gainKwh = r.kwhTotal - resultats[0].kwhTotal;
          if (gainKwh > 0.5) {
            const gainF = Math.round(gainKwh * tarifsActuels.tranches[0].prix);
            sousTexte = `Equivaut a ${gainF.toLocaleString("fr-FR")} F d'electricite en plus, meme budget`;
          } else {
            sousTexte = "Pas mieux que l'option precedente ici";
          }
        }
      } else {
        headline = r.montantTotal.toLocaleString("fr-FR") + " F";
        if (i > 0 && !resultats[0].erreur) {
          const diff = resultats[0].montantTotal - r.montantTotal;
          sousTexte = diff > 0 ? `${diff.toLocaleString("fr-FR")} F de moins que tout maintenant` : "Pas moins cher que tout maintenant";
        }
      }
      if (i === 0) {
        const kwhObtenu = optMode === "budget" ? r.kwhTotal : r.detail.reduce((s, d) => s + d.kwh, 0);
        const cumulApres0 = Math.round((cumul + kwhObtenu) * 100) / 100;
        const style0 = PALIER_STYLE[palierActuel(cumulApres0)];
        extra = { palierLabel: style0.label, palierText: style0.text, cumulApres: cumulApres0 };
      }
      html += rendreOptionOptimiseur(titres[i], badges[i], i === meilleurIndex, headline, sousTexte, r.detail, false, extra);
    });

    const previsionEffective = joursRestantsEtDate(releves, achats, tauxEffectif);
    if (previsionEffective) {
      html += `<div style="background:var(--warning-bg);border-radius:8px;padding:10px 12px;"><p style="font-size:12px;color:var(--warning-text);margin:0;line-height:1.5;">A ce rythme, ton solde compteur tient environ ${Math.round(previsionEffective.joursRestants)} jours - verifie que ca suffise avant le prochain achat prevu pour les options etalees.</p></div>`;
    }

    optResultEl.innerHTML = html;
  });
}

function renderAchats() {
  const cumul = cumulMoisEnCours(achats);
  const premierAchat = estPremierAchatDuMois(achats);
  const achatEdite = achatEnEditionId ? achats.find((a) => a.id === achatEnEditionId) : null;

  tabContent.innerHTML = `
    <form id="achat-form" class="card" style="margin-bottom:20px;">
      <p style="font-size:14px;font-weight:600;margin:0 0 14px;">${achatEdite ? "Modifier l'achat" : "Ajouter un achat"}</p>
      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:14px;">
        <div>
          ${statHead("wallet", "Montant (FCFA)")}
          <input type="text" inputmode="decimal" id="a-montant" value="${achatEdite ? achatEdite.montant : ""}" />
        </div>
        <div>
          ${statHead("calendar", "Date et heure")}
          <input type="datetime-local" id="a-date" value="${achatEdite ? datetimeLocalStr(toDate(achatEdite.date)) : nowLocalDatetimeStr()}" />
        </div>
        <div>
          ${statHead("coin", "Mode de paiement")}
          <select id="a-mode">
            <option value="mobile" ${achatEdite && achatEdite.modePaiement === "mobile" ? "selected" : ""}>Mobile money</option>
            <option value="carte" ${achatEdite && achatEdite.modePaiement === "carte" ? "selected" : ""}>Carte</option>
            <option value="especes" ${achatEdite && achatEdite.modePaiement === "especes" ? "selected" : ""}>Especes (+1%)</option>
          </select>
        </div>
        <div>
          ${statHead("bolt", "kWh recus (SMS Woyofal)")}
          <input type="text" inputmode="decimal" id="a-kwh" value="${achatEdite ? achatEdite.kwh : ""}" />
        </div>
      </div>
      <p style="font-size:12.5px;color:var(--text-muted);margin:0 0 10px;">Le champ kWh se pre-remplit en quittant le champ montant - corrige-le avec le chiffre reel recu par SMS.</p>
      <div id="a-detail" style="margin-bottom:10px;"></div>
      <p id="a-ecart" style="font-size:12px;color:var(--warning-text);margin:0 0 10px;display:none;line-height:1.5;"></p>
      <p id="a-error" style="font-size:13px;color:var(--danger-text);margin:0 0 10px;display:none;"></p>
      <div style="display:flex;gap:8px;">
        <button type="submit" class="primary" style="flex:1;">${achatEdite ? "Enregistrer les modifications" : "Enregistrer"}</button>
        ${achatEdite ? `<button type="button" id="a-annuler-btn">Annuler</button>` : ""}
      </div>
    </form>
    <p style="font-size:14px;font-weight:600;margin:0 0 8px;">Historique des achats</p>
    ${achats.length === 0
      ? `<p style="color:var(--text-secondary);font-size:14px;">Aucun achat enregistre pour le moment.</p>`
      : `<div class="card" style="padding:0;">${achats.map((a) => {
          const aDetail = a.redevance !== undefined;
          return `
          <div class="row" style="flex-direction:column;align-items:stretch;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <p style="font-size:10.5px;color:var(--text-muted);margin:0 0 2px;">${fmtDateHeure(a.date)}</p>
                <p style="font-size:14px;font-weight:600;color:var(--text-primary);margin:0;">${a.montant.toLocaleString("fr-FR")} F</p>
              </div>
              <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:13px;color:var(--text-secondary);">${a.kwh} kWh</span>
                ${aDetail ? `
                  <button data-toggle-achat="${a.id}" class="icon-btn" aria-label="Detail">
                    <svg id="chevron-achat-${a.id}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .15s;"><path d="M6 9l6 6 6-6"></path></svg>
                  </button>
                ` : ""}
                <button data-edit-achat="${a.id}" class="icon-btn" aria-label="Modifier">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
                <button data-del-achat="${a.id}" class="icon-btn" aria-label="Supprimer">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M10 11v6M14 11v6"></path><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12"></path><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path></svg>
                </button>
              </div>
            </div>
            ${aDetail ? `<div id="detail-achat-${a.id}" style="display:none;margin-top:10px;">${detailAchatHtml(a.redevance, a.taxeCommunaleMontant, a.tvaMontant, a.kwh)}</div>` : ""}
          </div>`;
        }).join("")}</div>`
    }
  `;

  let estimationKwh = null;
  const aKwhEl = document.getElementById("a-kwh");
  const aEcartEl = document.getElementById("a-ecart");

  document.getElementById("a-montant").addEventListener("blur", () => {
    const montantEl = document.getElementById("a-montant");
    const detailEl = document.getElementById("a-detail");
    const val = parseMontant(montantEl.value);
    if (val > 0) {
      const res = calculerKwh(val, cumul, premierAchat);
      if (!res.erreur) {
        aKwhEl.value = res.kwh;
        estimationKwh = res.kwh;
        aEcartEl.style.display = "none";
        detailEl.innerHTML = detailAchatHtml(res.redevance, res.taxeCommunaleMontant, res.tvaMontant, res.kwh);
      } else {
        detailEl.innerHTML = "";
        estimationKwh = null;
      }
    } else {
      detailEl.innerHTML = "";
      estimationKwh = null;
    }
    formatMontantInput(montantEl);
  });

  aKwhEl.addEventListener("input", () => {
    const saisi = parseMontant(aKwhEl.value);
    if (estimationKwh === null || !saisi || saisi <= 0) {
      aEcartEl.style.display = "none";
      return;
    }
    const ecart = Math.abs(saisi - estimationKwh);
    const ecartRelatif = ecart / estimationKwh;
    if (ecartRelatif > 0.02 && ecart > 0.3) {
      aEcartEl.style.display = "block";
      aEcartEl.textContent = `Ecart de ${ecart.toFixed(1)} kWh (${Math.round(ecartRelatif * 100)}%) avec l'estimation (${estimationKwh} kWh). Si ca se reproduit a chaque achat, verifie ta categorie tarifaire dans Parametres - ou la formule (redevance/taxe/TVA) doit peut-etre etre ajustee pour ta categorie.`;
    } else {
      aEcartEl.style.display = "none";
    }
  });

  document.getElementById("achat-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const montant = parseMontant(document.getElementById("a-montant").value);
    const kwh = parseMontant(document.getElementById("a-kwh").value);
    const date = document.getElementById("a-date").value;
    const modePaiement = document.getElementById("a-mode").value;
    const errorEl = document.getElementById("a-error");
    if (!montant || montant <= 0) { errorEl.style.display = "block"; errorEl.textContent = "Entre un montant valide."; return; }
    if (!kwh || kwh <= 0) { errorEl.style.display = "block"; errorEl.textContent = "Entre le nombre de kWh recus."; return; }
    errorEl.style.display = "none";
    const calc = calculerKwh(montant, cumul, premierAchat);
    const breakdown = calc.erreur
      ? { redevance: 0, taxeCommunaleMontant: 0, tvaMontant: 0 }
      : { redevance: calc.redevance, taxeCommunaleMontant: calc.taxeCommunaleMontant, tvaMontant: calc.tvaMontant };
    if (achatEnEditionId) {
      await modifierAchat(achatEnEditionId, { montant, kwh, modePaiement, date, ...breakdown });
      achatEnEditionId = null;
    } else {
      await ajouterAchat({ montant, kwh, modePaiement, date, ...breakdown });
    }
  });

  tabContent.querySelectorAll("[data-toggle-achat]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.toggleAchat;
      const detailDiv = document.getElementById(`detail-achat-${id}`);
      const chevron = document.getElementById(`chevron-achat-${id}`);
      const isOpen = detailDiv.style.display !== "none";
      detailDiv.style.display = isOpen ? "none" : "block";
      chevron.style.transform = isOpen ? "rotate(0deg)" : "rotate(180deg)";
    });
  });

  if (achatEdite) {
    document.getElementById("a-annuler-btn").addEventListener("click", () => {
      achatEnEditionId = null;
      render();
    });
  }

  tabContent.querySelectorAll("[data-edit-achat]").forEach((btn) => {
    btn.addEventListener("click", () => {
      achatEnEditionId = btn.dataset.editAchat;
      render();
    });
  });

  tabContent.querySelectorAll("[data-del-achat]").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (achatEnEditionId === btn.dataset.delAchat) achatEnEditionId = null;
      supprimerAchat(btn.dataset.delAchat);
    });
  });
}

function renderReleves() {
  const releveEdite = releveEnEditionId ? releves.find((r) => r.id === releveEnEditionId) : null;

  tabContent.innerHTML = `
    <form id="releve-form" class="card" style="margin-bottom:20px;">
      <p style="font-size:14px;font-weight:600;margin:0 0 14px;">${releveEdite ? "Modifier le releve" : "Ajouter un releve"}</p>
      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:14px;">
        <div>
          ${statHead("gauge", "Solde kWh restant")}
          <input type="text" inputmode="decimal" id="r-solde" value="${releveEdite ? releveEdite.soldeKwh : ""}" />
        </div>
        <div>
          ${statHead("calendar", "Date et heure")}
          <input type="datetime-local" id="r-date" value="${releveEdite ? datetimeLocalStr(toDate(releveEdite.date)) : nowLocalDatetimeStr()}" />
        </div>
      </div>
      <p id="r-error" style="font-size:13px;color:var(--danger-text);margin:0 0 10px;display:none;"></p>
      <div style="display:flex;gap:8px;">
        <button type="submit" class="primary" style="flex:1;">${releveEdite ? "Enregistrer les modifications" : "Enregistrer"}</button>
        ${releveEdite ? `<button type="button" id="r-annuler-btn">Annuler</button>` : ""}
      </div>
    </form>

    <p style="font-size:14px;font-weight:600;margin:0 0 8px;">Historique des releves</p>
    ${releves.length === 0
      ? `<p style="color:var(--text-secondary);font-size:14px;">Aucun releve enregistre pour le moment.</p>`
      : `<div class="card" style="padding:0;">${releves.map((r) => `
          <div class="row" style="align-items:center;">
            <p style="font-size:10.5px;color:var(--text-muted);margin:0;">${fmtDateHeure(r.date)}</p>
            <div style="display:flex;align-items:center;gap:12px;">
              <span style="font-size:14px;font-weight:600;color:var(--text-primary);">${r.soldeKwh} kWh</span>
              <button data-edit-releve="${r.id}" class="icon-btn" aria-label="Modifier">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </button>
              <button data-del-releve="${r.id}" class="icon-btn" aria-label="Supprimer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M10 11v6M14 11v6"></path><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12"></path><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path></svg>
              </button>
            </div>
          </div>`).join("")}</div>`
    }
  `;

  document.getElementById("releve-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const soldeKwh = parseMontant(document.getElementById("r-solde").value);
    const date = document.getElementById("r-date").value;
    const errorEl = document.getElementById("r-error");
    if (isNaN(soldeKwh) || soldeKwh < 0) { errorEl.style.display = "block"; errorEl.textContent = "Entre un solde kWh valide."; return; }
    errorEl.style.display = "none";
    if (releveEnEditionId) {
      await modifierReleve(releveEnEditionId, { soldeKwh, date });
      releveEnEditionId = null;
    } else {
      await ajouterReleve({ soldeKwh, date });
    }
  });

  if (releveEdite) {
    document.getElementById("r-annuler-btn").addEventListener("click", () => {
      releveEnEditionId = null;
      render();
    });
  }

  tabContent.querySelectorAll("[data-edit-releve]").forEach((btn) => {
    btn.addEventListener("click", () => {
      releveEnEditionId = btn.dataset.editReleve;
      render();
    });
  });

  tabContent.querySelectorAll("[data-del-releve]").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (releveEnEditionId === btn.dataset.delReleve) releveEnEditionId = null;
      supprimerReleve(btn.dataset.delReleve);
    });
  });
}

// PWA service worker
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
