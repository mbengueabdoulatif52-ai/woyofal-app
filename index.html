<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ---------------------------------------------------------------
// 1. CONFIG FIREBASE - remplace ces valeurs par celles de TON projet
// (Console Firebase > Parametres du projet > Tes applications > Web app)
// ---------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyDu8AbE4QOtkkfdDqpXs0F66NdB-n_Fz5M",
  authDomain: "woyofal-app.firebaseapp.com",
  projectId: "woyofal-app",
  storageBucket: "woyofal-app.firebasestorage.app",
  messagingSenderId: "52682466974",
  appId: "1:52682466974:web:37c1c3bd8384424657fd8f",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();
const db = getFirestore(app);

// Persistance hors-ligne : les données déjà chargées restent consultables
// sans reseau, et les achats/releves ajoutes hors-ligne se synchronisent
// automatiquement au retour de la connexion. Echoue silencieusement si
// plusieurs onglets sont ouverts ou si le navigateur ne le supporte pas -
// l'appli continue de fonctionner normalement, juste sans ce confort.
enableIndexedDbPersistence(db).catch((err) => {
  if (err.code === "failed-precondition") {
    console.warn("Persistance hors-ligne désactivée : plusieurs onglets Woyofal ouverts a la fois.");
  } else if (err.code === "unimplemented") {
    console.warn("Persistance hors-ligne non supportee par ce navigateur.");
  }
});

// ---------------------------------------------------------------
// 2. MOTEUR TARIFAIRE WOYOFAL (par categorie)
// Chiffres 2026 confirmes par Senelec pour Domestique Petite Puissance
// (grille tarifaire officielle + posts Woyofal). La redevance (429 F) n'est
// confirmee que pour le DPP - a verifier pour les autres catégories.
// Taxe communale (2.5%) et TVA (18% au-dela de 250 kWh) sont des taxes
// generiques, appliquees ici a toutes les catégories.
// ---------------------------------------------------------------
const TARIFS_PAR_CATEGORIE = {
  DPP: {
    label: "Domestique Petite Puissance (DPP)",
    redevanceMensuelle: 429,
    taxeCommunale: 0.025,
    tva: 0.18,
    tranches: [
      { max: 150, prix: 82.00 },
      { max: 250, prix: 136.49 },
      { max: null, prix: 136.49, tvaApplicable: true },
    ],
  },
  DMP: {
    label: "Domestique Moyenne Puissance (DMP)",
    redevanceMensuelle: 429,
    taxeCommunale: 0.025,
    tva: 0.18,
    tranches: [
      { max: 150, prix: 111.23 },
      { max: 250, prix: 143.54 },
      { max: null, prix: 143.54, tvaApplicable: true },
    ],
  },
  PPP: {
    label: "Professionnel Petite Puissance (PPP)",
    redevanceMensuelle: 429,
    taxeCommunale: 0.025,
    tva: 0.18,
    tranches: [
      { max: 150, prix: 147.43 },
      { max: 250, prix: 189.84 },
      { max: null, prix: 189.84, tvaApplicable: true },
    ],
  },
  PMP: {
    label: "Professionnel Moyenne Puissance (PMP)",
    redevanceMensuelle: 429,
    taxeCommunale: 0.025,
    tva: 0.18,
    tranches: [
      { max: 150, prix: 165.01 },
      { max: 250, prix: 191.01 },
      { max: null, prix: 191.01, tvaApplicable: true },
    ],
  },
};

let categorieTarifaire = "DPP";

function getTarifsActuels() {
  return TARIFS_PAR_CATEGORIE[categorieTarifaire] || TARIFS_PAR_CATEGORIE.DPP;
}

const CODES_UTILES = [
  { code: "800", label: "Consommation totale d'énergie" },
  { code: "801", label: "Credit restant" },
  { code: "804", label: "Numero du compteur" },
  { code: "808", label: "Puissance instantanee" },
  { code: "809", label: "Verification usage" },
  { code: "810", label: "Valeur du decouvert" },
  { code: "811", label: "Credit d'urgence (a activer une fois a zero)" },
  { code: "812", label: "Desactivation de l'alarme sonore" },
  { code: "813", label: "Consommation de la journee precedente" },
  { code: "814", label: "Consommation d'énergie du mois en cours" },
  { code: "815", label: "Date de la dernière recharge" },
  { code: "816", label: "Heure de la dernière recharge" },
  { code: "817", label: "Montant de la dernière recharge" },
  { code: "820", label: "Consommation du mois precedent" },
  { code: "830", label: "Code de la dernière recharge" },
];

function calculerKwh(montantFcfa, cumulDejaAchete, isPremierAchatDuMois, tarifs) {
  tarifs = tarifs || getTarifsActuels();
  const redevance = isPremierAchatDuMois ? tarifs.redevanceMensuelle : 0;
  let solde = montantFcfa - redevance;
  if (solde <= 0) return { kwh: 0, erreur: "montant_insuffisant", redevance: Math.round(redevance) };
  const taxeCommunaleMontant = solde * tarifs.taxeCommunale;
  solde = solde - taxeCommunaleMontant;

  let kwh = 0, remaining = solde, cum = cumulDejaAchete, guard = 0, tvaMontant = 0;
  for (const tranche of tarifs.tranches) {
    if (remaining <= 0.001 || guard++ > 20) break;
    const plafond = tranche.max === null ? Infinity : tranche.max;
    if (cum >= plafond) continue;
    const capacite = plafond - cum;
    const prixUnitaire = tranche.tvaApplicable ? tranche.prix * (1 + tarifs.tva) : tranche.prix;
    const coutCapacite = capacite === Infinity ? Infinity : capacite * prixUnitaire;
    let ajout, coutReel;
    if (coutCapacite !== Infinity && remaining >= coutCapacite) {
      ajout = capacite; coutReel = coutCapacite;
    } else {
      ajout = remaining / prixUnitaire; coutReel = remaining;
    }
    if (tranche.tvaApplicable) tvaMontant += coutReel - ajout * tranche.prix;
    kwh += ajout; cum += ajout; remaining -= coutReel;
  }
  return {
    kwh: Math.round(kwh * 100) / 100,
    cumulApres: Math.round(cum * 100) / 100,
    redevance: Math.round(redevance),
    taxeCommunaleMontant: Math.round(taxeCommunaleMontant),
    tvaMontant: Math.round(tvaMontant),
    erreur: null,
  };
}

function palierActuel(cumulKwh, tarifs) {
  tarifs = tarifs || getTarifsActuels();
  for (let i = 0; i < tarifs.tranches.length; i++) {
    const plafond = tarifs.tranches[i].max;
    if (plafond === null || cumulKwh < plafond) return i + 1;
  }
  return tarifs.tranches.length;
}

function kwhRestantAvantProchainPalier(cumulKwh, tarifs) {
  tarifs = tarifs || getTarifsActuels();
  const palier = palierActuel(cumulKwh, tarifs);
  const tranche = tarifs.tranches[palier - 1];
  if (tranche.max === null) return null;
  return Math.max(0, tranche.max - cumulKwh);
}

// ---------------------------------------------------------------
// 2b. OPTIMISEUR D'ACHAT MULTI-MOIS
// Chaque mois "frais" (a partir du 2e) repart a 0 kWh et redemande la
// redevance mensuelle - donc etaler n'est rentable que si l'acces a la
// tranche 1 (moins chere) du mois suivant compense ce coût fixe. Les
// deux fonctions ci-dessous remplissent les tranches disponibles par
// prix croissant (les moins cheres d'abord, tous mois confondus).
// ---------------------------------------------------------------
function genererSlotsMultiMois(nMois, cumulActuel, tarifs, besoinMois0) {
  besoinMois0 = besoinMois0 || 0;
  const slots = [];
  for (let m = 0; m < nMois; m++) {
    let cum = m === 0 ? cumulActuel : 0;
    for (const tranche of tarifs.tranches) {
      const plafond = tranche.max === null ? Infinity : tranche.max;
      if (cum >= plafond) continue;
      const capacite = plafond - cum;
      const prixUnitaire = tranche.tvaApplicable ? tranche.prix * (1 + tarifs.tva) : tranche.prix;
      slots.push({ mois: m, capacite, prixUnitaire });
      cum = plafond;
    }
  }
  slots.sort((a, b) => a.prixUnitaire - b.prixUnitaire);

  if (besoinMois0 <= 0.01) return slots.map((s) => ({ ...s, priorite: 1 }));

  // Le besoin physique réel du mois 0 (solde compteur + rythme) est isolé
  // en priorite absolue, puise dans les tranches les moins cheres DU MOIS 0
  // (dans l'ordre ou elles apparaissent déjà triees par prix) - avant que
  // le reste ne rivalise normalement avec les autres mois sur le prix seul.
  let besoinRestant = besoinMois0;
  const resultat = [];
  for (const slot of slots) {
    if (slot.mois === 0 && besoinRestant > 0.01) {
      const partGarantie = Math.min(slot.capacite, besoinRestant);
      resultat.push({ mois: 0, capacite: partGarantie, prixUnitaire: slot.prixUnitaire, priorite: 0 });
      besoinRestant -= partGarantie;
      const resteCapacite = slot.capacite - partGarantie;
      if (resteCapacite > 0.01) {
        resultat.push({ mois: 0, capacite: resteCapacite, prixUnitaire: slot.prixUnitaire, priorite: 1 });
      }
    } else {
      resultat.push({ ...slot, priorite: 1 });
    }
  }
  resultat.sort((a, b) => a.priorite - b.priorite || a.prixUnitaire - b.prixUnitaire);
  return resultat;
}

function redevancesParMois(nMois, premierMoisEstPremier, tarifs) {
  const redevances = [];
  for (let m = 0; m < nMois; m++) {
    redevances.push((m === 0 ? premierMoisEstPremier : true) ? tarifs.redevanceMensuelle : 0);
  }
  return redevances;
}

// Budget fixe -> maximiser le kWh obtenu. La redevance d'un mois n'est
// prelevee que lorsqu'on achète réellement quelque chose dans ce mois -
// sinon etaler sur plus de mois serait toujours pire, même quand ca
// n'aide pas (redevance payee pour rien).
const MONTANT_MIN_ACHAT = 1000; // Woyofal vendu a partir de 1000 F (grille officielle Senelec)

function planifierParBudget(budget, nMois, cumulActuel, premierMoisEstPremier, tarifs, besoinMois0, moisExclus) {
  tarifs = tarifs || getTarifsActuels();
  moisExclus = moisExclus || [];
  const redevances = redevancesParMois(nMois, premierMoisEstPremier, tarifs);
  const slots = genererSlotsMultiMois(nMois, cumulActuel, tarifs, besoinMois0).filter((s) => !moisExclus.includes(s.mois));
  const detail = Array.from({ length: nMois }, () => ({ montant: 0, kwh: 0 }));
  const redevancePayee = Array(nMois).fill(false);
  let budgetRestant = budget;
  let kwhTotal = 0;

  for (const slot of slots) {
    if (budgetRestant <= 0.01) break;
    const m = slot.mois;
    if (!redevancePayee[m]) {
      const r = redevances[m];
      if (budgetRestant < r) continue;
      budgetRestant -= r;
      detail[m].montant += r;
      redevancePayee[m] = true;
    }
    const netDispo = budgetRestant * (1 - tarifs.taxeCommunale);
    const coutNetSlotMax = slot.capacite === Infinity ? Infinity : slot.capacite * slot.prixUnitaire;
    let kwhAjoute, montantReelUtilise;
    if (coutNetSlotMax !== Infinity && netDispo >= coutNetSlotMax) {
      kwhAjoute = slot.capacite;
      montantReelUtilise = coutNetSlotMax / (1 - tarifs.taxeCommunale);
    } else {
      kwhAjoute = netDispo / slot.prixUnitaire;
      montantReelUtilise = budgetRestant;
    }
    detail[m].montant += montantReelUtilise;
    detail[m].kwh += kwhAjoute;
    kwhTotal += kwhAjoute;
    budgetRestant -= montantReelUtilise;
  }

  // Chaque entrée représente un achat Woyofal réel - en dessous de 1000 F ce
  // n'est pas realisable. On exclut ce mois et on relance plutot que de
  // proposer un achat théorique impossible a faire dans la vraie vie.
  const moisSousMinimum = detail.findIndex((d) => d.montant > 0 && d.montant < MONTANT_MIN_ACHAT);
  if (moisSousMinimum !== -1 && moisExclus.length < nMois) {
    return planifierParBudget(budget, nMois, cumulActuel, premierMoisEstPremier, tarifs, besoinMois0, [...moisExclus, moisSousMinimum]);
  }

  const detailFinal = detail.filter((d) => d.montant > 0).map((d) => ({
    montant: Math.round(d.montant), kwh: Math.round(d.kwh * 100) / 100,
  }));
  const redevanceTotale = redevances.reduce((a, b, i) => a + (redevancePayee[i] ? b : 0), 0);
  const manqueMois0 = Math.round(Math.max(0, (besoinMois0 || 0) - detail[0].kwh) * 100) / 100;

  if (kwhTotal <= 0) return { erreur: "budget_insuffisant_redevances", redevanceTotale };
  return { kwhTotal: Math.round(kwhTotal * 100) / 100, redevanceTotale, detail: detailFinal, erreur: null, manqueMois0, nbMoisOuverts: detailFinal.length };
}

// kWh cible -> minimiser le montant total. Meme principe : un mois qui ne
// sert a rien n'est jamais ouvert (sa redevance n'est jamais payee).
function planifierParKwh(kwhCible, nMois, cumulActuel, premierMoisEstPremier, tarifs, besoinMois0, moisExclus) {
  tarifs = tarifs || getTarifsActuels();
  moisExclus = moisExclus || [];
  const redevances = redevancesParMois(nMois, premierMoisEstPremier, tarifs);
  const slots = genererSlotsMultiMois(nMois, cumulActuel, tarifs, besoinMois0).filter((s) => !moisExclus.includes(s.mois));
  const detail = Array.from({ length: nMois }, () => ({ montant: 0, kwh: 0 }));
  const redevancePayee = Array(nMois).fill(false);
  let kwhRestant = kwhCible;

  for (const slot of slots) {
    if (kwhRestant <= 0.001) break;
    const m = slot.mois;
    if (!redevancePayee[m]) {
      detail[m].montant += redevances[m];
      redevancePayee[m] = true;
    }
    const kwhPris = Math.min(kwhRestant, slot.capacite);
    const montantReel = (kwhPris * slot.prixUnitaire) / (1 - tarifs.taxeCommunale);
    detail[m].montant += montantReel;
    detail[m].kwh += kwhPris;
    kwhRestant -= kwhPris;
  }

  const moisSousMinimum = detail.findIndex((d) => d.montant > 0 && d.montant < MONTANT_MIN_ACHAT);
  if (moisSousMinimum !== -1 && moisExclus.length < nMois) {
    return planifierParKwh(kwhCible, nMois, cumulActuel, premierMoisEstPremier, tarifs, besoinMois0, [...moisExclus, moisSousMinimum]);
  }

  const detailFinal = detail.filter((d) => d.montant > 0).map((d) => ({
    montant: Math.round(d.montant), kwh: Math.round(d.kwh * 100) / 100,
  }));
  const redevanceTotale = redevances.reduce((a, b, i) => a + (redevancePayee[i] ? b : 0), 0);
  const montantTotal = detailFinal.reduce((s, d) => s + d.montant, 0);
  const manqueMois0 = Math.round(Math.max(0, (besoinMois0 || 0) - detail[0].kwh) * 100) / 100;

  return { montantTotal, redevanceTotale, detail: detailFinal, erreur: null, manqueMois0, nbMoisOuverts: detailFinal.length };
}

// ---------------------------------------------------------------
// "LE PLUS ECONOMIQUE" - nombre de mois trouve automatiquement
// Grace au remplissage "paresseux" (un mois n'est ouvert, et sa redevance
// facturee, que s'il sert vraiment), augmenter nMois ne peut jamais degrader
// le résultat - donc on augmente tant que ca ameliore, et on s'arrête des
// que ce n'est plus le cas. Pas de plafond fixe cote metier, juste une
// sécurité anti-boucle et un seuil d'avertissement pour un plan trop étalé.
// A résultat économique égal (a 0.01 pres), on depage par : moins de mois
// ouverts, puis moins d'achats - hierarchie validee par revue croisee.
// ---------------------------------------------------------------
const PLAFOND_SECURITE_MOIS = 24;
const SEUIL_AVERTISSEMENT_MOIS = 4;

function planifierLePlusEconomique(mode, valeur, cumulActuel, premierMoisEstPremier, tarifs, besoinMois0) {
  const planifier = mode === "budget" ? planifierParBudget : planifierParKwh;
  const scoreEco = (r) => (mode === "budget" ? r.kwhTotal : -r.montantTotal);

  let meilleur = planifier(valeur, 1, cumulActuel, premierMoisEstPremier, tarifs, besoinMois0);
  let n = 1;
  while (n < PLAFOND_SECURITE_MOIS) {
    const candidat = planifier(valeur, n + 1, cumulActuel, premierMoisEstPremier, tarifs, besoinMois0);
    if (candidat.erreur) break;
    const diff = scoreEco(candidat) - scoreEco(meilleur);
    if (diff > 0.01) {
      meilleur = candidat;
    } else if (Math.abs(diff) <= 0.01 && candidat.nbMoisOuverts < meilleur.nbMoisOuverts) {
      meilleur = candidat; // égalité économique, mais moins de mois ouverts
    } else {
      break;
    }
    n++;
  }
  return meilleur;
}

// Besoin physique réel du mois en cours (independant des tranches) : ce
// qu'il faut acheter en plus pour ne pas tomber a sec avant la fin du mois
// calendaire, compte tenu de ce qui est déjà sur le compteur. Sans rythme
// connu, aucune garantie n'est possible - on retombe sur l'optimisation pure.
const JOURS_MARGE_SECURITE = 5;

function dateLimiteMois0() {
  const maintenant = new Date();
  return new Date(maintenant.getFullYear(), maintenant.getMonth() + 1, 1 + JOURS_MARGE_SECURITE);
}

function calculerBesoinMois0(rythme) {
  if (!rythme || rythme <= 0) return 0;
  const maintenant = new Date();
  // Couvre jusqu'au JOURS_MARGE_SECURITE du mois suivant, pas juste jusqu'au
  // 30/31 - une marge pour ne pas tomber a sec si la conso réelle depasse
  // un peu la moyenne sur quelques jours, ou avant d'avoir eu le temps de
  // faire le prochain achat.
  const dateCible = dateLimiteMois0();
  const joursACouvrir = Math.max(0, joursEntre(maintenant, dateCible));
  const prevision = joursRestantsEtDate(releves, achats, rythme);
  const soldeActuel = prevision ? prevision.soldeEstime : (releves[0] ? releves[0].soldeKwh : 0);
  return Math.max(0, rythme * joursACouvrir - soldeActuel);
}

// Compare "utiliser la capacite restante du mois en cours" contre "sauter
// entièrement ce mois et tout acheter a partir du mois prochain". Les deux
// peuvent donner le même total (même tarif partout) - dans ce cas, on
// prefere celle qui demande le moins d'achats. Uniquement pertinent quand
// le mois en cours n'a aucun besoin réel a couvrir (sinon le sauter serait
// dangereux, pas juste sous-optimal).
function planifierMeilleureStrategie(mode, valeur, cumulActuel, premierMoisEstPremier, tarifs, besoinMois0) {
  const optionA = planifierLePlusEconomique(mode, valeur, cumulActuel, premierMoisEstPremier, tarifs, besoinMois0);
  if (besoinMois0 > 0.01) return optionA;

  const optionB = planifierLePlusEconomique(mode, valeur, 0, true, tarifs, 0);
  if (optionA.erreur) return optionB.erreur ? optionA : { ...optionB, decalageMois: 1 };
  if (optionB.erreur) return optionA;

  const bMeilleure = mode === "budget"
    ? optionB.kwhTotal > optionA.kwhTotal + 0.01
    : optionB.montantTotal < optionA.montantTotal - 0.5;
  const egaliteMaisPlusSimple = mode === "budget"
    ? Math.abs(optionB.kwhTotal - optionA.kwhTotal) <= 0.01 && optionB.detail.length < optionA.detail.length
    : Math.abs(optionB.montantTotal - optionA.montantTotal) <= 0.5 && optionB.detail.length < optionA.detail.length;

  if (bMeilleure || egaliteMaisPlusSimple) return { ...optionB, decalageMois: 1 };
  return optionA;
}

// ---------------------------------------------------------------
// FACTEUR DE CORRECTION INTERNE (Optimiseur uniquement)
// Compare, sur l'historique du compteur, le kWh reellement reçu (SMS) au
// kWh théorique que la formule avait estimé au moment de l'achat. Le ratio
// moyen sert a affiner silencieusement les projections de l'Optimiseur,
// sans jamais toucher aux constantes tarifaires ni au reste de l'appli
// (le formulaire d'achat et la detection d'écart restent sur la formule
// pure, volontairement, pour continuer a detecter les anomalies).
// ---------------------------------------------------------------
const SEUIL_ACHATS_CALIBRATION = 5;

function facteurCorrection(achatsListe) {
  const ratios = achatsListe
    .filter((a) => a.kwhEstime && a.kwhEstime > 0 && a.kwh > 0)
    .map((a) => a.kwh / a.kwhEstime)
    .filter((r) => r >= 0.5 && r <= 2); // ecarte les saisies aberrantes
  if (ratios.length < SEUIL_ACHATS_CALIBRATION) return null;
  return ratios.reduce((s, r) => s + r, 0) / ratios.length;
}

function appliquerFacteurCorrection(resultat, facteur, mode) {
  if (!facteur || resultat.erreur) return resultat;
  if (mode === "budget") {
    const besoinImplicite = (resultat.manqueMois0 || 0) + (resultat.detail[0] ? resultat.detail[0].kwh : 0);
    const detailCorrige = resultat.detail.map((d) => ({ ...d, kwh: Math.round(d.kwh * facteur * 100) / 100 }));
    return {
      ...resultat,
      kwhTotal: Math.round(resultat.kwhTotal * facteur * 100) / 100,
      detail: detailCorrige,
      manqueMois0: Math.round(Math.max(0, besoinImplicite - (detailCorrige[0] ? detailCorrige[0].kwh : 0)) * 100) / 100,
    };
  }
  return {
    ...resultat,
    montantTotal: Math.round(resultat.montantTotal / facteur),
    detail: resultat.detail.map((d) => ({ ...d, montant: Math.round(d.montant / facteur) })),
  };
}

function toDate(d) {
  if (!d) return new Date(0);
  if (typeof d.toDate === "function") return d.toDate();
  return new Date(d);
}

function debutMois() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), 1);
}

function cumulMoisEnCours(achats) {
  const debut = debutMois();
  return achats.reduce((sum, a) => (toDate(a.date) >= debut ? sum + (a.kwh || 0) : sum), 0);
}

function estPremierAchatDuMois(achats) {
  const debut = debutMois();
  return !achats.some((a) => toDate(a.date) >= debut);
}

// ---------------------------------------------------------------
// 2b. PREVISIONS A PARTIR DES RELEVES
// Le rythme de conso (kWh/jour) se deduit de la baisse du solde entre deux
// releves, en tenant compte des achats survenus entre les deux (sinon un
// achat au milieu de l'intervalle fausserait completement le calcul).
// ---------------------------------------------------------------
function joursEntre(d1, d2) {
  return (toDate(d2) - toDate(d1)) / (1000 * 60 * 60 * 24);
}

function intervallesConsommation(releves, achats) {
  const RYTHME_MAX_PLAUSIBLE = 50; // kWh/jour - au-dela, c'est forcement une erreur de saisie
  // ou une ambiguite d'ordre achat/releve le même jour (on ne suit que la date, pas l'heure).
  const sorted = [...releves].sort((a, b) => toDate(a.date) - toDate(b.date));
  const intervalles = [];
  for (let i = 0; i < sorted.length - 1; i++) {
    const debut = sorted[i];
    const fin = sorted[i + 1];
    const jours = joursEntre(debut.date, fin.date);
    if (jours <= 0) continue;
    const achatsEntre = achats
      .filter((a) => toDate(a.date) > toDate(debut.date) && toDate(a.date) <= toDate(fin.date))
      .reduce((s, a) => s + (a.kwh || 0), 0);
    const conso = debut.soldeKwh + achatsEntre - fin.soldeKwh;
    const tauxJournalier = conso / jours;
    intervalles.push({
      debut: debut.date, fin: fin.date, jours,
      conso, tauxJournalier,
      anomalie: conso < 0 || tauxJournalier > RYTHME_MAX_PLAUSIBLE,
    });
  }
  return intervalles;
}

function tauxMoyenJournalier(intervalles) {
  const valides = intervalles.filter((i) => !i.anomalie);
  const totalConso = valides.reduce((s, i) => s + i.conso, 0);
  const totalJours = valides.reduce((s, i) => s + i.jours, 0);
  return totalJours > 0 ? totalConso / totalJours : null;
}

function joursRestantsEtDate(releves, achats, taux) {
  if (!taux || taux <= 0 || releves.length === 0) return null;
  const sorted = [...releves].sort((a, b) => toDate(b.date) - toDate(a.date));
  const dernier = sorted[0];
  const maintenant = new Date();
  const joursDepuis = Math.max(0, joursEntre(dernier.date, maintenant));
  const achatsDepuis = achats
    .filter((a) => toDate(a.date) > toDate(dernier.date))
    .reduce((s, a) => s + (a.kwh || 0), 0);
  const soldeEstime = dernier.soldeKwh + achatsDepuis - taux * joursDepuis;
  const joursRestants = Math.max(0, soldeEstime / taux);
  const dateEstimee = new Date(maintenant.getTime() + joursRestants * 86400000);
  return { soldeEstime: Math.max(0, soldeEstime), joursRestants, dateEstimee };
}

function graphiqueConsommationSVG(intervalles) {
  if (intervalles.length < 2) {
    return `<p style="font-size:13px;color:var(--text-secondary);margin:0;">Ajoute encore un relevé pour voir l'evolution dans le temps (un seul intervalle ne donne rien a comparer).</p>`;
  }
  const derniers = intervalles.slice(-8);
  const maxTaux = Math.max(...derniers.map((i) => Math.max(0, i.tauxJournalier)), 0.1);
  const width = 300, height = 90, barWidth = width / derniers.length;
  const bars = derniers.map((iv, idx) => {
    const h = Math.max(2, (Math.max(0, iv.tauxJournalier) / maxTaux) * (height - 22));
    const x = idx * barWidth + barWidth * 0.15;
    const w = barWidth * 0.7;
    const y = height - h - 16;
    const color = iv.anomalie ? "#B23A2A" : "#1B3A52";
    const label = toDate(iv.fin).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}" rx="2"></rect>
      <text x="${x + w / 2}" y="${height - 4}" font-size="9" fill="#8A9199" text-anchor="middle">${label}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;">${bars}</svg>`;
}

  ` : `
    <div id="compteur-ajout-toggle" style="border:1px dashed var(--border);border-radius:10px;padding:12px;text-align:center;cursor:pointer;">
      <span style="font-size:13px;color:var(--text-secondary);font-weight:500;">+ Ajouter un compteur</span>
    </div>
  `;

  listeEl.querySelectorAll("[data-switch-compteur]").forEach((el) => {
    el.addEventListener("click", () => switcherCompteur(el.dataset.switchCompteur));
  });
  listeEl.querySelectorAll("[data-renommer]").forEach((btn) => {
    btn.addEventListener("click", () => { compteurEnRenommageId = btn.dataset.renommer; renderCompteursListe(); });
  });
  listeEl.querySelectorAll("[data-renommer-annuler]").forEach((btn) => {
    btn.addEventListener("click", () => { compteurEnRenommageId = null; renderCompteursListe(); });
  });
  listeEl.querySelectorAll("[data-renommer-save]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const nouveauNom = document.getElementById("renommer-input").value.trim();
      if (nouveauNom) await renommerCompteur(currentUser.uid, btn.dataset.renommerSave, nouveauNom);
      compteurEnRenommageId = null;
      renderCompteursListe();
    });
  });
  listeEl.querySelectorAll("[data-supprimer-compteur]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (confirm("Supprimer ce compteur et tout son historique (achats, releves) ? Cette action est irreversible.")) {
        await supprimerCompteur(currentUser.uid, btn.dataset.supprimerCompteur);
        renderCompteursListe();
      }
    });
  });

  if (ajoutCompteurOuvert) {
    document.getElementById("nouveau-compteur-annuler").addEventListener("click", () => {
      ajoutCompteurOuvert = false;
      renderCompteursListe();
    });
    document.getElementById("nouveau-compteur-creer").addEventListener("click", async () => {
      const nom = document.getElementById("nouveau-compteur-nom").value.trim();
      const categorie = document.getElementById("nouveau-compteur-categorie").value;
      if (!nom) return;
      const nouvelId = await ajouterCompteur(currentUser.uid, nom, categorie);
      ajoutCompteurOuvert = false;
      await switcherCompteur(nouvelId);
      renderCompteursListe();
    });
  } else {
    document.getElementById("compteur-ajout-toggle").addEventListener("click", () => {
      ajoutCompteurOuvert = true;
      renderCompteursListe();
    });
  }
}

// Deplace les anciennes données "a plat" (users/{uid}/achats, /releves) vers
// un premier compteur "Compteur 1", si ce n'est pas déjà fait. Ne s'execute
// qu'une fois par compte (ne fait rien si des compteurs existent déjà).
async function migrerVersMultiCompteurs(uid) {
  const compteursSnap = await getDocs(collection(db, "users", uid, "compteurs"));
  if (!compteursSnap.empty) return;

  const userSnap = await getDoc(doc(db, "users", uid));
  const ancienneCategorie = (userSnap.exists() && userSnap.data().categorieTarifaire) || "DPP";

  const nouveauCompteurRef = await addDoc(collection(db, "users", uid, "compteurs"), {
    nom: "Compteur 1",
    categorieTarifaire: ancienneCategorie,
    createdAt: Timestamp.now(),
  });
  const compteurId = nouveauCompteurRef.id;

  const anciensAchats = await getDocs(collection(db, "users", uid, "achats"));
  for (const d of anciensAchats.docs) {
    await setDoc(doc(db, "users", uid, "compteurs", compteurId, "achats", d.id), d.data());
  }
  const anciensReleves = await getDocs(collection(db, "users", uid, "releves"));
  for (const d of anciensReleves.docs) {
    await setDoc(doc(db, "users", uid, "compteurs", compteurId, "releves", d.id), d.data());
  }

  await setDoc(doc(db, "users", uid), { compteurActifId: compteurId }, { merge: true });
}

function listenCompteurs(uid) {
  unsubCompteurs = onSnapshot(collection(db, "users", uid, "compteurs"), (snap) => {
    compteurs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    mettreAJourCategorieActuelle();
    mettreAJourLabelCompteurActif();
    render();
    renderCompteursListe();
  });
}

function mettreAJourLabelCompteurActif() {
  const labelEl = document.getElementById("compteur-actif-label");
  if (!labelEl) return;
  const c = compteurs.find((c) => c.id === compteurActifId);
  labelEl.textContent = c ? c.nom : "";
}

function activerListenersCompteur(uid, compteurId) {
  if (unsubAchats) unsubAchats();
  if (unsubReleves) unsubReleves();
  achats = []; releves = [];
  listenAchats(uid, compteurId);
  listenReleves(uid, compteurId);
}

async function switcherCompteur(id) {
  if (!currentUser || id === compteurActifId) return;
  compteurActifId = id;
  await setDoc(doc(db, "users", currentUser.uid), { compteurActifId: id }, { merge: true });
  mettreAJourCategorieActuelle();
  mettreAJourLabelCompteurActif();
  activerListenersCompteur(currentUser.uid, id);
  renderCompteursListe();
  render();
}

async function ajouterCompteur(uid, nom, categorie) {
  const ref = await addDoc(collection(db, "users", uid, "compteurs"), {
    nom, categorieTarifaire: categorie, createdAt: Timestamp.now(),
  });
  return ref.id;
}
async function renommerCompteur(uid, id, nom) {
  await updateDoc(doc(db, "users", uid, "compteurs", id), { nom });
}
async function sauvegarderCategorieCompteur(uid, id, categorie) {
  await updateDoc(doc(db, "users", uid, "compteurs", id), { categorieTarifaire: categorie });
}
async function supprimerCompteur(uid, id) {
  const achatsSnap = await getDocs(collection(db, "users", uid, "compteurs", id, "achats"));
  for (const d of achatsSnap.docs) await deleteDoc(d.ref);
  const relevesSnap = await getDocs(collection(db, "users", uid, "compteurs", id, "releves"));
  for (const d of relevesSnap.docs) await deleteDoc(d.ref);
  await deleteDoc(doc(db, "users", uid, "compteurs", id));
}

function listenAchats(uid, compteurId) {
  const q = query(collection(db, "users", uid, "compteurs", compteurId, "achats"), orderBy("date", "desc"));
  unsubAchats = onSnapshot(q, (snap) => {
    achats = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  });
}

function listenReleves(uid, compteurId) {
  const q = query(collection(db, "users", uid, "compteurs", compteurId, "releves"), orderBy("date", "desc"));
  unsubReleves = onSnapshot(q, (snap) => {
    releves = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  });
}

function nomCompteurActuel() {
  const c = compteurs.find((c) => c.id === compteurActifId);
  return c ? c.nom : "Compteur";
}
function nomCompteurPourFichier() {
  return nomCompteurActuel().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "");
}
function telechargerFichier(nomFichier, contenu, type) {
  const blob = new Blob([contenu], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nomFichier;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exporterAchatsCSV() {

    lignes.push([
      d.toLocaleDateString("fr-FR"),
      d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }),
      a.montant,
      String(a.kwh).replace(".", ","),
      LABELS_MODE_PAIEMENT[a.modePaiement] || a.modePaiement || "",
      a.redevance || 0,
      a.taxeCommunaleMontant || 0,
      a.tvaMontant || 0,
    ].join(";"));
  });
  telechargerFichier(`woyofal-achats-${nomCompteurPourFichier()}-${todayStr()}.csv`, "\uFEFF" + lignes.join("\r\n"), "text/csv;charset=utf-8;");

function exporterAchatsPDF() {

    if (y > 275) { docPdf.addPage(); y = 20; }
    if (i % 2 === 0) { docPdf.setFillColor(247, 246, 242); docPdf.rect(14, y - 5, 182, 7, "F"); }

    docPdf.text(`${d.toLocaleDateString("fr-FR")} ${d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`, 16, y);

    docPdf.text(LABELS_MODE_PAIEMENT[a.modePaiement] || a.modePaiement || "", 155, y);
    totalMontant += a.montant || 0;
    totalKwh += a.kwh || 0;
    y += 7;
  });

  docPdf.setDrawColor(27, 58, 82);
  docPdf.line(14, y - 3, 196, y - 3);
  y += 3;
  docPdf.setFontSize(10);
  docPdf.setTextColor(27, 58, 82);
  docPdf.text("Total", 16, y);

  docPdf.text(`${Math.round(totalKwh * 100) / 100}`, 130, y, { align: "right" });

}

const SEUIL_ALERTE_JOURS = 3;
const SEUIL_JOURS_RELEVE = 3;

function renderAlerteSolde() {
  const el = document.getElementById("alerte-solde");
  if (!el) return;
  const intervalles = intervallesConsommation(releves, achats);
  const taux = tauxMoyenJournalier(intervalles);
  const prevision = joursRestantsEtDate(releves, achats, taux);
  if (prevision && prevision.joursRestants <= SEUIL_ALERTE_JOURS) {
    const jours = Math.round(prevision.joursRestants);
    el.innerHTML = `
      <div style="background:var(--danger-bg);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:20px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--danger-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <p style="font-size:13px;color:var(--danger-text);margin:0;line-height:1.5;"><strong>Solde presque épuisé</strong> - environ ${jours} jour${jours > 1 ? "s" : ""} restant${jours > 1 ? "s" : ""} a ton rythme actuel, a sec vers le ${prevision.dateEstimee.toLocaleDateString("fr-FR")}.</p>
      </div>
    `;
  } else {
    el.innerHTML = "";
  }
}

function renderRappelReleve() {
  const el = document.getElementById("rappel-releve");
  if (!el) return;
  let message = null;
  if (releves.length === 0) {
    message = "<strong>Aucun releve enregistre</strong> - ajoutes-en un pour activer les prévisions.";
  } else {
    const jours = Math.floor(joursEntre(releves[0].date, new Date()));
    if (jours >= SEUIL_JOURS_RELEVE) {
      message = `<strong>Pas de releve depuis ${jours} jour${jours > 1 ? "s" : ""}</strong> - ajoutes-en un pour garder des prévisions fiables.`;
    }
  }
  if (message) {
    el.innerHTML = `
      <div id="rappel-releve-clic" style="background:var(--warning-bg);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;margin-bottom:20px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--warning-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
        <p style="font-size:13px;color:var(--warning-text);margin:0;line-height:1.5;flex:1;">${message}</p>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--warning-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 18l6-6-6-6"></path></svg>
      </div>
    `;
    document.getElementById("rappel-releve-clic").addEventListener("click", () => {
      currentTab = "releves";
      document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === "releves"));
      render();
    });
  } else {
    el.innerHTML = "";
  }
}

  3: { bg: "var(--danger-bg)", text: "var(--danger-text)", label: "Tranche 3" },
};

// Icones discretes (currentColor) + helpers pour une hierarchie coherente
// sur toutes les cartes-statistiques du tableau de bord.
const ICONS = {
  wallet: '<path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v3"></path><path d="M3 7v10a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1H6a2 2 0 0 1-2-2z"></path><circle cx="16" cy="14" r="1.4" fill="currentColor" stroke="none"></circle>',
  coin: '<circle cx="12" cy="12" r="9"></circle><path d="M9 9.5a2.6 2 0 0 1 3-1.8c1.5.3 2 1.3 2 2.1 0 2-4 1.5-4 3.6 0 1 1 1.8 2.5 1.8s2.5-.6 2.5-1.6"></path><path d="M12 6.5v1M12 16v1"></path>',
  gauge: '<path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4-6"></path><circle cx="12" cy="17" r="1.3" fill="currentColor" stroke="none"></circle>',
  bolt: '<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" fill="currentColor" stroke="none"></path>',
  clock: '<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path>',
  refresh: '<path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v4h4"></path>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path>',
  chart: '<path d="M3 3v18h18"></path><path d="M7 15l4-6 3 3 5-8"></path>',
};

function statHead(iconKey, label, color) {
  color = color || "var(--text-muted)";
  return `<div style="display:flex;align-items:flex-start;gap:5px;margin-bottom:7px;min-height:26px;color:${color};">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;">${ICONS[iconKey]}</svg>
    <span style="font-size:10px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;line-height:1.3;">${label}</span>
  </div>`;
}

function statValue(value, unit, color) {
  color = color || "var(--text-primary)";
  return `<p style="margin:0;font-variant-numeric:tabular-nums;"><span style="font-size:20px;font-weight:700;color:${color};">${value}</span>${unit ? ` <span style="font-size:12px;color:var(--text-muted);">${unit}</span>` : ""}</p>`;
}

function detailAchatHtml(redevance, taxeCommunaleMontant, tvaMontant, kwh) {
  const lignes = [];
  if (redevance > 0) lignes.push(["Redevance (1er achat du mois)", redevance]);
  if (taxeCommunaleMontant > 0) lignes.push(["Taxe communale (2,5%)", taxeCommunaleMontant]);
  if (tvaMontant > 0) lignes.push(["TVA (18%, au-dela de 250 kWh)", tvaMontant]);
  return `
    <div style="background:var(--bg);border-radius:8px;padding:12px;">
      ${lignes.map(([label, montant]) => `
        <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-secondary);padding:3px 0;">
          <span>${label}</span><span>${montant.toLocaleString("fr-FR")} F</span>
        </div>
      `).join("")}
      ${lignes.length ? `<div style="height:1px;background:var(--border);margin:6px 0;"></div>` : ""}
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-primary);font-weight:600;padding:3px 0;">
        <span>Converti en énergie</span><span>${kwh} kWh</span>
      </div>
    </div>
  `;
}

function renderDashboard() {
  const cumul = cumulMoisEnCours(achats);
  const palier = palierActuel(cumul);
  const restant = kwhRestantAvantProchainPalier(cumul);
  const dernierReleve = releves[0];

  const intervalles = intervallesConsommation(releves, achats);
  const taux = tauxMoyenJournalier(intervalles);
  const prevision = joursRestantsEtDate(releves, achats, taux);
  const aAnomalie = intervalles.some((i) => i.anomalie);

  const besoinPrevu = calculerBesoinMois0(taux);
  let coutEstimeHtml = "";
  if (taux !== null) {
    if (besoinPrevu > 0.5) {
      const calcCout = planifierParKwh(besoinPrevu, 1, cumul, estPremierAchatDuMois(achats), getTarifsActuels());
      coutEstimeHtml = `
        <div style="background:var(--warning-bg);border-radius:10px;padding:12px 14px;margin-bottom:14px;">
          ${statHead("wallet", "Cout estime", "var(--warning-text)")}
          <p style="margin:0 0 3px;"><span style="font-size:19px;font-weight:700;color:var(--warning-text);">~${calcCout.montantTotal.toLocaleString("fr-FR")} F</span></p>
          <p style="font-size:11.5px;color:var(--warning-text);margin:0;">Pour tenir jusqu'au ${dateLimiteMois0().toLocaleDateString("fr-FR")} (${Math.round(besoinPrevu * 10) / 10} kWh), a ton rythme actuel</p>
        </div>
      `;
    } else {
      coutEstimeHtml = `
        <div style="background:var(--success-bg);border-radius:10px;padding:12px 14px;margin-bottom:14px;">
          <p style="font-size:12.5px;color:var(--success-text);margin:0;">Pas d'achat nécessaire pour l'instant - ton solde couvre déjà tes besoins jusqu'au ${dateLimiteMois0().toLocaleDateString("fr-FR")}.</p>
        </div>
      `;
    }
  }

  const t1max = getTarifsActuels().tranches[0].max;
  const t2max = getTarifsActuels().tranches[1].max;
  const jaugeMax = t2max + 60;
  const markerPct = Math.min(100, (cumul / jaugeMax) * 100);
  const style = PALIER_STYLE[palier];

  tabContent.innerHTML = `
    <div class="grid" style="margin-bottom:20px;">
      <div class="card" style="background:${style.bg};border-color:transparent;">
        ${statHead("wallet", "kWh achetés ce mois", style.text)}
        ${statValue(cumul.toFixed(1), "kWh", style.text)}
        <p style="font-size:11px;margin:6px 0 0;color:${style.text};">${style.label}</p>
      </div>
      <div class="card">
        ${statHead("gauge", "Solde compteur")}
        ${prevision
          ? `${statValue(Math.round(prevision.soldeEstime * 10) / 10, "kWh")}<p style="font-size:11px;margin:6px 0 0;color:var(--text-muted);">Estime (achats inclus)</p>`
          : dernierReleve
            ? `${statValue(dernierReleve.soldeKwh, "kWh")}<p style="font-size:11px;margin:6px 0 0;color:var(--text-muted);">Dernier releve</p>`
            : statValue("-", "")
        }
      </div>
    </div>

    <div style="margin-bottom:20px;">
      <div style="position:relative;height:16px;border-radius:8px;background:#E9E7E0;overflow:hidden;margin-bottom:8px;">
        <div style="position:absolute;left:0;top:0;bottom:0;width:${markerPct}%;background:${palier === 1 ? "#1E6B3C" : palier === 2 ? "#C9820F" : "#B23A2A"};border-radius:8px;"></div>
        <div style="position:absolute;left:${(t1max / jaugeMax) * 100}%;top:0;bottom:0;width:1px;background:var(--bg);"></div>
        <div style="position:absolute;left:${(t2max / jaugeMax) * 100}%;top:0;bottom:0;width:1px;background:var(--bg);"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;">
        <span style="font-weight:600;color:${style.text};">${cumul.toFixed(1)} kWh</span>
        <span style="color:var(--text-muted);">${restant !== null ? Math.round(restant) + " kWh avant la tranche " + (palier + 1) : style.label}</span>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <p style="font-size:14px;font-weight:600;margin:0 0 12px;">Prévisions</p>
      ${releves.length < 2
        ? `<p style="font-size:13px;color:var(--text-secondary);margin:0;">Ajoute au moins 2 releves espacés dans le temps (onglet Releves) pour activer les prévisions.</p>`
        : `
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;margin-bottom:16px;">
            <div style="padding:0 12px 0 0;border-right:1px solid var(--border);">
              ${statHead("bolt", "Rythme moyen")}
              ${statValue(taux !== null ? taux.toFixed(2) : "-", taux !== null ? "kWh/j" : "")}
            </div>
            <div style="padding:0 12px;border-right:1px solid var(--border);">
              ${statHead("clock", "Jours restants")}
              ${statValue(prevision ? Math.round(prevision.joursRestants) : "-", prevision ? "j" : "")}
            </div>
            <div style="padding:0 0 0 12px;">
              ${statHead("calendar", "A sec le")}
              ${statValue(prevision ? prevision.dateEstimee.toLocaleDateString("fr-FR") : "-", "", prevision ? "var(--danger-text)" : undefined)}
            </div>
          </div>
          ${coutEstimeHtml}
          <div style="height:1px;background:var(--border);margin:0 0 14px;"></div>
          ${statHead("chart", "Conso par période (kWh/j)")}
          ${graphiqueConsommationSVG(intervalles)}
          ${aAnomalie ? `<p style="font-size:12px;color:var(--danger-text);margin:8px 0 0;">Une période en rouge signale un rythme incoherent (negatif ou irrealiste) sur cette période - souvent un achat et un releve enregistres le même jour dans le mauvais ordre. Cet intervalle est exclu du rythme moyen.</p>` : ""}
        `
      }
    </div>

    <div class="card">
      <p style="font-size:14px;font-weight:600;margin:0 0 12px;">Optimiseur d'achat</p>
      <div style="display:flex;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:14px;">
        <button id="opt-mode-budget" style="flex:1;text-align:center;padding:7px;font-size:12.5px;border:none;border-radius:6px;background:var(--surface);font-weight:600;color:var(--text-primary);">Mon budget</button>
        <button id="opt-mode-kwh" style="flex:1;text-align:center;padding:7px;font-size:12.5px;border:none;border-radius:6px;background:none;color:var(--text-muted);font-weight:400;">Mon besoin en kWh</button>
      </div>

      <div style="background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:12px;color:var(--text-secondary);">Rythme utilisé : <strong id="opt-rythme-valeur" style="color:var(--text-primary);">-</strong></span>
          <span id="opt-rythme-source" style="font-size:11px;color:var(--text-muted);"></span>
        </div>
        <p style="font-size:11px;color:var(--text-muted);margin:0 0 6px;">Affiner avec ta conso du mois en cours (code 814)</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div><p style="font-size:10.5px;color:var(--text-muted);margin:0 0 3px;">Conso (kWh)</p><input type="text" inputmode="decimal" id="opt-conso814" placeholder="Ex: 45" /></div>
          <div><p style="font-size:10.5px;color:var(--text-muted);margin:0 0 3px;">Relevee le</p><input type="date" id="opt-date814" value="${todayStr()}" /></div>
        </div>
        <p id="opt-rythme-note" style="font-size:11px;margin:6px 0 0;display:none;"></p>
      </div>

      <p id="opt-label" style="font-size:12px;color:var(--text-muted);margin:0 0 4px;">Combien veux-tu depenser au total ?</p>
      <p style="font-size:11.5px;color:var(--text-muted);margin:0 0 8px;">${estPremierAchatDuMois(achats) ? "Ce serait ton 1er achat du mois (redevance appliquee)." : "Redevance déjà payee ce mois-ci."}</p>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <input type="text" inputmode="decimal" id="opt-input" placeholder="Montant en FCFA" style="flex:1;" />
        <button class="accent" id="opt-btn">Comparer</button>
      </div>
      <div id="opt-result"></div>
    </div>
  `;

  // --- Optimiseur d'achat ---
  let optMode = "budget";
  const optModeBudgetBtn = document.getElementById("opt-mode-budget");
  const optModeKwhBtn = document.getElementById("opt-mode-kwh");
  const optLabelEl = document.getElementById("opt-label");
  const optInputEl = document.getElementById("opt-input");
  const optResultEl = document.getElementById("opt-result");
  const optConso814El = document.getElementById("opt-conso814");
  const optDate814El = document.getElementById("opt-date814");
  const optRythmeValeurEl = document.getElementById("opt-rythme-valeur");
  const optRythmeSourceEl = document.getElementById("opt-rythme-source");
  const optRythmeNoteEl = document.getElementById("opt-rythme-note");

  function majModeOptimiseur() {
    const surBudget = optMode === "budget";
    optModeBudgetBtn.style.background = surBudget ? "var(--surface)" : "none";
    optModeBudgetBtn.style.fontWeight = surBudget ? "600" : "400";
    optModeBudgetBtn.style.color = surBudget ? "var(--text-primary)" : "var(--text-muted)";
    optModeKwhBtn.style.background = surBudget ? "none" : "var(--surface)";
    optModeKwhBtn.style.fontWeight = surBudget ? "400" : "600";
    optModeKwhBtn.style.color = surBudget ? "var(--text-muted)" : "var(--text-primary)";
    optLabelEl.textContent = surBudget ? "Combien veux-tu depenser au total ?" : "De combien de kWh as-tu besoin au total ?";
    optInputEl.placeholder = surBudget ? "Montant en FCFA" : "kWh souhaites";
    optInputEl.value = "";
    optResultEl.innerHTML = "";
  }

  optModeBudgetBtn.addEventListener("click", () => { optMode = "budget"; majModeOptimiseur(); });
  optModeKwhBtn.addEventListener("click", () => { optMode = "kwh"; majModeOptimiseur(); });
  optInputEl.addEventListener("input", () => { optResultEl.innerHTML = ""; });

  function calculerTauxEffectif() {
    const conso = parseMontant(optConso814El.value);
    const dateStr = optDate814El.value;
    if (conso > 0 && dateStr) {
      const jours = joursEntre(debutMois(), new Date(dateStr));
      if (jours > 0) return { taux: conso / jours, source: "814", jours };
    }
    return { taux: taux, source: taux !== null ? "calcule" : null, jours: null };
  }

  function majAffichageRythme() {
    const r = calculerTauxEffectif();
    optRythmeValeurEl.textContent = r.taux !== null ? r.taux.toFixed(2) + " kWh/j" : "-";
    optRythmeSourceEl.textContent = r.taux === null ? "" : (r.source === "814" ? "via code 814" : "calcule");
    if (r.taux === null) {
      optRythmeNoteEl.style.display = "block";
      optRythmeNoteEl.style.color = "var(--text-muted)";
      optRythmeNoteEl.textContent = "Aucun rythme connu pour l'instant - renseigne ta conso du mois en cours ci-dessus pour comparer en jours.";
    } else if (r.source === "814" && r.jours < 3) {
      optRythmeNoteEl.style.display = "block";
      optRythmeNoteEl.style.color = "var(--warning-text)";
      optRythmeNoteEl.textContent = "Peu de jours ecoules ce mois-ci - ce rythme reste approximatif.";
    } else {
      optRythmeNoteEl.style.display = "none";
    }
  }
  majAffichageRythme();
  optConso814El.addEventListener("input", majAffichageRythme);
  optDate814El.addEventListener("change", majAffichageRythme);

  function rendreOptionOptimiseur(titre, badgeAchats, estMeilleure, headline, sousTexte, detail, insuffisant, extra, decalageMois) {
    decalageMois = decalageMois || 0;
    const bg = estMeilleure ? "var(--success-bg)" : "var(--surface)";
    const borderCol = estMeilleure ? "transparent" : "var(--border)";
    const couleur = estMeilleure ? "var(--success-text)" : "var(--text-primary)";
    if (insuffisant) {
      return `<div class="card" style="border-color:var(--border);margin-bottom:10px;padding:14px;"><p style="font-size:13px;color:var(--text-muted);margin:0;">${titre} : montant insuffisant pour couvrir les redevances de ${badgeAchats.toLowerCase()}.</p></div>`;
    }
    const decalageNote = decalageMois > 0
      ? `<p style="font-size:11.5px;color:${couleur};margin:0 0 8px;opacity:0.85;">Aucun besoin ce mois-ci - ${detail.length > 1 ? "premier achat" : "achat"} prevu le mois prochain.</p>`
      : "";
    const detailHtml = detail.length > 1 ? detail.map((d, i) => `
      <div style="background:var(--surface);border-radius:8px;padding:10px 12px;margin-top:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-primary);margin-bottom:2px;">
          <span style="font-weight:600;">${i === 0 && decalageMois === 0 ? "Achat 1 - maintenant" : "Achat " + (i + 1) + " - mois +" + (i + decalageMois)}</span>
          <span style="font-weight:600;">${d.montant.toLocaleString("fr-FR")} F</span>
        </div>
        <p style="font-size:11.5px;color:var(--text-muted);margin:0;">${d.kwh} kWh</p>
      </div>
    `).join("") : "";
    const extraHtml = extra ? `
      <div style="margin-top:10px;">
        <span style="display:inline-block;background:var(--surface);color:${extra.palierText};font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;">${extra.palierLabel}</span>
        <p style="font-size:12px;color:${couleur};margin:6px 0 0;">Cumul après achat : <strong>${extra.cumulApres} kWh</strong></p>
      </div>
    ` : "";
    return `
      <div style="border:1px solid ${borderCol};border-radius:10px;padding:14px;margin-bottom:10px;background:${bg};">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:13px;font-weight:600;color:${couleur};">${titre}</span>
          <span style="font-size:11px;color:${estMeilleure ? couleur : "var(--text-muted)"};">${badgeAchats}</span>
        </div>
        <p style="font-size:20px;font-weight:700;margin:6px 0 ${sousTexte || decalageNote ? "4px" : "0"};color:${couleur};">${headline}</p>
        ${sousTexte ? `<p style="font-size:12px;color:${couleur};margin:0 0 4px;">${sousTexte}</p>` : ""}
        ${decalageNote}
        ${extraHtml}
        ${detailHtml}
      </div>
    `;
  }

  document.getElementById("opt-btn").addEventListener("click", () => {
    const val = parseMontant(optInputEl.value);
    if (!val || val <= 0) {
      optResultEl.innerHTML = `<p style="font-size:13px;color:var(--danger-text);margin:0;">Entre une valeur valide.</p>`;
      return;
    }
    const tarifsActuels = getTarifsActuels();
    const premier = estPremierAchatDuMois(achats);
    const rythmeInfo = calculerTauxEffectif();
    const tauxEffectif = rythmeInfo.taux;
    const facteur = facteurCorrection(achats);

    const planifier = optMode === "budget" ? planifierParBudget : planifierParKwh;
    const besoinMois0 = calculerBesoinMois0(tauxEffectif);
    const rapide = appliquerFacteurCorrection(planifier(val, 1, cumul, premier, tarifsActuels, besoinMois0), facteur, optMode);
    const economique = appliquerFacteurCorrection(planifierMeilleureStrategie(optMode, val, cumul, premier, tarifsActuels, besoinMois0), facteur, optMode);
    const nbMoisEconomique = economique.erreur ? 1 : economique.detail.length;

    function afficherOption(r) {
      if (r.erreur) return null;
      const headline = optMode === "budget"
        ? (tauxEffectif ? Math.round(r.kwhTotal / tauxEffectif) + " jours" : r.kwhTotal + " kWh")
        : r.montantTotal.toLocaleString("fr-FR") + " F";
      let extra = null;
      if (r.detail.length === 1) {
        const kwhObtenu = optMode === "budget" ? r.kwhTotal : r.detail.reduce((s, d) => s + d.kwh, 0);
        const baseCumul = r.decalageMois ? 0 : cumul;
        const cumulApres = Math.round((baseCumul + kwhObtenu) * 100) / 100;
        const style0 = PALIER_STYLE[palierActuel(cumulApres)];
        extra = { palierLabel: style0.label, palierText: style0.text, cumulApres };
      }
      return { headline, extra };
    }

    let html = "";

    if (nbMoisEconomique <= 1 && !economique.decalageMois) {
      const info = afficherOption(rapide);
      html += rendreOptionOptimiseur("Tout maintenant", "1 achat", true, info ? info.headline : "", "Etaler n'apporte rien ici a ce montant", rapide.detail, rapide.erreur, info ? info.extra : null);
    } else {
      const infoRapide = afficherOption(rapide);
      html += rendreOptionOptimiseur("Le plus rapide", "1 achat", false, infoRapide ? infoRapide.headline : "", null, rapide.detail, rapide.erreur, infoRapide ? infoRapide.extra : null);

      const infoEco = afficherOption(economique);
      let sousTexteEco = null;
      if (!rapide.erreur && !economique.erreur) {
        if (optMode === "budget") {
          const gainKwh = economique.kwhTotal - rapide.kwhTotal;
          if (gainKwh > 0.5) {
            const gainF = Math.round(gainKwh * tarifsActuels.tranches[0].prix);
            sousTexteEco = `Equivaut a ${gainF.toLocaleString("fr-FR")} F d'electricite en plus, même budget`;
          } else if (economique.decalageMois) {
            sousTexteEco = "Meme resultat qu'acheter maintenant, mais en un seul achat";
          }
        } else {
          const diff = rapide.montantTotal - economique.montantTotal;
          if (diff > 0.5) {
            sousTexteEco = `${diff.toLocaleString("fr-FR")} F de moins que tout maintenant`;
          } else if (economique.decalageMois) {
            sousTexteEco = "Meme coût qu'acheter maintenant, mais en un seul achat";
          }
        }
      }
      html += rendreOptionOptimiseur("Le plus economique", `${nbMoisEconomique} achat${nbMoisEconomique > 1 ? "s" : ""}`, true, infoEco ? infoEco.headline : "", sousTexteEco, economique.detail, economique.erreur, infoEco ? infoEco.extra : null, economique.decalageMois || 0);

      if (nbMoisEconomique > SEUIL_AVERTISSEMENT_MOIS) {
        html += `<div style="background:var(--warning-bg);border-radius:8px;padding:10px 12px;margin-bottom:10px;"><p style="font-size:12px;color:var(--warning-text);margin:0;line-height:1.5;">Ce plan s'étalé sur ${nbMoisEconomique} mois - vérifie que ca reste raisonnable pour toi avant de t'y engager.</p></div>`;
      }
    }

    const previsionEffective = joursRestantsEtDate(releves, achats, tauxEffectif);
    if (previsionEffective) {
      html += `<div style="background:var(--warning-bg);border-radius:8px;padding:10px 12px;"><p style="font-size:12px;color:var(--warning-text);margin:0;line-height:1.5;">A ce rythme, ton solde compteur tient environ ${Math.round(previsionEffective.joursRestants)} jours - vérifie que ca suffise avant le prochain achat prevu pour les options etalees.</p></div>`;
    }

    if (besoinMois0 > 0.01) {
      html += `<p style="font-size:11.5px;color:var(--text-muted);margin:8px 0 0;">Le besoin de ce mois est calcule pour tenir jusqu'au ${dateLimiteMois0().toLocaleDateString("fr-FR")}.</p>`;
    }
    const manqueDetecte = Math.max(rapide.manqueMois0 || 0, economique.manqueMois0 || 0);
    if (manqueDetecte > 0.5) {
      html += `<div style="background:var(--danger-bg);border-radius:8px;padding:10px 12px;margin-top:8px;"><p style="font-size:12px;color:var(--danger-text);margin:0;line-height:1.5;"><strong>Ce montant ne couvre pas ton besoin reel du mois</strong> - il manquerait environ ${manqueDetecte} kWh par rapport a ce qu'il te faut pour tenir jusqu'au ${dateLimiteMois0().toLocaleDateString("fr-FR")}.</p></div>`;
    }

    optResultEl.innerHTML = html;
  });
}

// ---------------------------------------------------------------
// 5. MODE SIMPLE - calculatrice montant <-> kWh, independante des
// données de suivi. Reste sur la catégorie du compteur actif (par
// defaut DPP) plutot que d'ajouter un choix de catégorie ici.
// ---------------------------------------------------------------
function renderSimuler() {
  const el = document.getElementById("simuler-content");
  if (!el) return;
  let tarifsActuels = getTarifsActuels();
  const montantMaxSlider = 200000; // plafond fixe - toute la courbe/graduations en decoulent
  let dernierCumul = null, dernierPremier = null; // pour ne redessiner la structure que si besoin

  const debut = debutMois();
  const totalMontantMois = achats.filter((a) => toDate(a.date) >= debut).reduce((s, a) => s + (a.montant || 0), 0);

  const W = 320, H = 190, padL = 30, padB = 35, padT = 10, padR = 8;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  el.innerHTML = `
    <div class="card">
      <p style="font-size:14px;font-weight:600;margin:0 0 4px;">Combien de kWh vais-je obtenir ?</p>
      <p style="font-size:12px;color:var(--text-secondary);margin:0 0 4px;">Catégorie tarifaire</p>
      <select id="sim-categorie" style="margin-bottom:14px;"></select>
      <p style="font-size:12px;color:var(--text-secondary);margin:0 0 4px;">Montant déjà acheté ce mois-ci</p>
      <input type="text" inputmode="decimal" id="sim-montant-prealable" value="${totalMontantMois || ""}" placeholder="0" style="margin-bottom:16px;" />
      <div style="display:flex;gap:12px;margin-bottom:14px;">
        <div style="flex:1;">
          <p style="font-size:9px;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-muted);margin:0 0 4px;font-weight:600;">Montant (F)</p>
          <input type="text" inputmode="decimal" id="sim-montant" style="font-size:15px;font-weight:600;" />
        </div>
        <div style="flex:1;">
          <p style="font-size:9px;letter-spacing:0.05em;text-transform:uppercase;color:var(--success-text);margin:0 0 4px;font-weight:600;">kWh obtenus</p>
          <input type="text" inputmode="decimal" id="sim-kwh" style="font-size:15px;font-weight:600;color:var(--success-text);border-color:var(--success-text);" />
        </div>
      </div>
      <div style="position:relative;height:190px;margin-bottom:8px;">
        <svg id="sim-courbe" viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;touch-action:none;cursor:pointer;"></svg>
      </div>
      <div style="display:flex;justify-content:center;gap:14px;margin-bottom:14px;">
        <span style="font-size:9px;color:var(--success-text);"><span style="display:inline-block;width:8px;height:8px;background:var(--success-bg);border:1px solid var(--success-text);border-radius:2px;margin-right:3px;"></span>Tranche 1</span>
        <span style="font-size:9px;color:var(--warning-text);"><span style="display:inline-block;width:8px;height:8px;background:var(--warning-bg);border:1px solid var(--warning-text);border-radius:2px;margin-right:3px;"></span>Tranche 2</span>
        <span style="font-size:9px;color:var(--danger-text);"><span style="display:inline-block;width:8px;height:8px;background:var(--danger-bg);border:1px solid var(--danger-text);border-radius:2px;margin-right:3px;"></span>Tranche 3</span>
      </div>
      <input type="range" id="sim-slider" min="0" max="${montantMaxSlider}" step="100" value="10000" style="width:100%;accent-color:var(--orange);margin-bottom:14px;" />
      <div id="sim-detail"></div>
    </div>
  `;

  const categorieSelectSim = document.getElementById("sim-categorie");
  Object.keys(TARIFS_PAR_CATEGORIE).forEach((code) => {
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = TARIFS_PAR_CATEGORIE[code].label;
    if (code === categorieTarifaire) opt.selected = true;
    categorieSelectSim.appendChild(opt);
  });
  categorieSelectSim.addEventListener("change", () => {
    tarifsActuels = TARIFS_PAR_CATEGORIE[categorieSelectSim.value] || TARIFS_PAR_CATEGORIE.DPP;
    dernierCumul = null; dernierPremier = null; // force le redessin complet (tarifs differents)
    majAffichage(parseFloat(document.getElementById("sim-slider").value) || 10000, false);
  });

  function etatSimulation() {
    const montantPrealable = parseMontant(document.getElementById("sim-montant-prealable").value) || 0;
    if (montantPrealable <= 0) return { cumulSimule: 0, premierSimule: true };
    const resPrealable = calculerKwh(montantPrealable, 0, true, tarifsActuels);
    return { cumulSimule: resPrealable.erreur ? 0 : resPrealable.kwh, premierSimule: false };
  }

  function toX(m) { return padL + (m / montantMaxSlider) * plotW; }

  // Dessine les parties qui ne changent que si le cumul de depart change :
  // axes, zones colorees par tranche, courbe, graduations. Cree aussi le
  // point et les pointilles UNE SEULE FOIS, avec une transition CSS, pour
  // qu'ils glissent au lieu de sauter d'une position a l'autre.
  function dessinerStructure(cumulSimule, premierSimule) {
    const svg = document.getElementById("sim-courbe");
    const points = [];
    const pas = montantMaxSlider / 50;
    let maxKwh = 0.001;
    for (let m = 0; m <= montantMaxSlider; m += pas) {
      const res = calculerKwh(m, cumulSimule, premierSimule, tarifsActuels);
      const kwh = res.erreur ? 0 : res.kwh;
      points.push({ m, kwh });
      if (kwh > maxKwh) maxKwh = kwh;
    }
    const toY = (kwh) => (H - padB) - (kwh / maxKwh) * plotH;
    const chemin = points.map((p, i) => `${i === 0 ? "M" : "L"}${toX(p.m).toFixed(1)},${toY(p.kwh).toFixed(1)}`).join(" ");

    let montantSeuil1 = null, montantSeuil2 = null;
    if (cumulSimule < 150) montantSeuil1 = planifierParKwh(150 - cumulSimule, 1, cumulSimule, premierSimule, tarifsActuels).montantTotal;
    if (cumulSimule < 250) montantSeuil2 = planifierParKwh(250 - cumulSimule, 1, cumulSimule, premierSimule, tarifsActuels).montantTotal;
    const xSeuil1 = montantSeuil1 !== null ? Math.min(toX(montantSeuil1), W - padR) : padL;
    const xSeuil2 = montantSeuil2 !== null ? Math.min(toX(montantSeuil2), W - padR) : padL;

    const zones = [];
    if (montantSeuil1 !== null) zones.push(`<rect x="${padL}" y="${padT}" width="${(xSeuil1 - padL).toFixed(1)}" height="${plotH}" fill="var(--success-bg)"></rect>`);
    if (montantSeuil2 !== null) zones.push(`<rect x="${xSeuil1.toFixed(1)}" y="${padT}" width="${(xSeuil2 - xSeuil1).toFixed(1)}" height="${plotH}" fill="var(--warning-bg)"></rect>`);
    zones.push(`<rect x="${xSeuil2.toFixed(1)}" y="${padT}" width="${(W - padR - xSeuil2).toFixed(1)}" height="${plotH}" fill="var(--danger-bg)"></rect>`);

    const graduationsX = [0, montantMaxSlider / 2, montantMaxSlider].map((m) => `<text x="${toX(m).toFixed(1)}" y="${H - padB + 13}" font-size="8" fill="var(--text-muted)" text-anchor="middle">${Math.round(m / 1000)}k</text>`).join("");
    const graduationsY = [0, maxKwh / 2, maxKwh].map((k) => `<text x="${padL - 4}" y="${(toY(k) + 3).toFixed(1)}" font-size="8" fill="var(--text-muted)" text-anchor="end">${Math.round(k)}</text>`).join("");

    svg.innerHTML = `
      ${zones.join("")}
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="var(--border)" />
      <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--border)" />
      ${graduationsX}
      ${graduationsY}
      <path d="${chemin}" fill="none" stroke="var(--navy)" stroke-width="2.5" />
      <line id="sim-ligne-v" x1="${padL}" y1="${H - padB}" x2="${padL}" y2="${H - padB}" stroke="var(--orange)" stroke-width="1" stroke-dasharray="3,3" style="transition:x1 .15s ease,x2 .15s ease,y2 .15s ease;" />
      <line id="sim-ligne-h" x1="${padL}" y1="${H - padB}" x2="${padL}" y2="${H - padB}" stroke="var(--orange)" stroke-width="1" stroke-dasharray="3,3" style="transition:x2 .15s ease,y1 .15s ease,y2 .15s ease;" />
      <circle id="sim-point" cx="${padL}" cy="${H - padB}" r="6" fill="var(--orange)" stroke="var(--surface)" stroke-width="2" style="transition:cx .15s ease,cy .15s ease;" />
    `;
    dernierCumul = cumulSimule;
    dernierPremier = premierSimule;
    return { maxKwh, toY };
  }

  let dernierMaxKwh = 0.001;
  function deplacerPoint(montantActuel, cumulSimule, premierSimule) {
    const res = calculerKwh(montantActuel, cumulSimule, premierSimule, tarifsActuels);
    const kwhActuel = res.erreur ? 0 : res.kwh;
    const toY = (kwh) => (H - padB) - (kwh / dernierMaxKwh) * plotH;
    const px = toX(Math.min(montantActuel, montantMaxSlider));
    const py = toY(kwhActuel);
    document.getElementById("sim-point").setAttribute("cx", px.toFixed(1));
    document.getElementById("sim-point").setAttribute("cy", py.toFixed(1));
    const ligneV = document.getElementById("sim-ligne-v");
    ligneV.setAttribute("x1", px.toFixed(1)); ligneV.setAttribute("x2", px.toFixed(1)); ligneV.setAttribute("y2", py.toFixed(1));
    const ligneH = document.getElementById("sim-ligne-h");
    ligneH.setAttribute("y1", py.toFixed(1)); ligneH.setAttribute("x2", px.toFixed(1)); ligneH.setAttribute("y2", py.toFixed(1));
  }

  function majDetail(montantActuel, cumulSimule, premierSimule) {
    const res = calculerKwh(montantActuel, cumulSimule, premierSimule, tarifsActuels);
    document.getElementById("sim-detail").innerHTML = res.erreur ? "" : detailAchatHtml(res.redevance, res.taxeCommunaleMontant, res.tvaMontant, res.kwh);
  }

  function majAffichage(valeur, depuisKwh) {
    const { cumulSimule, premierSimule } = etatSimulation();
    let montantFinal, kwhFinal;
    if (depuisKwh) {
      const res = planifierParKwh(Math.max(0, valeur), 1, cumulSimule, premierSimule, tarifsActuels);
      montantFinal = Math.min(res.montantTotal, montantMaxSlider);
      kwhFinal = Math.round(calculerKwh(montantFinal, cumulSimule, premierSimule, tarifsActuels).kwh * 100) / 100;
    } else {
      montantFinal = Math.min(Math.max(0, valeur), montantMaxSlider);
      const res = calculerKwh(montantFinal, cumulSimule, premierSimule, tarifsActuels);
      kwhFinal = res.erreur ? 0 : res.kwh;
    }
    document.getElementById("sim-montant").value = Math.round(montantFinal).toLocaleString("fr-FR");
    document.getElementById("sim-kwh").value = kwhFinal;
    document.getElementById("sim-slider").value = Math.round(montantFinal / 100) * 100;

    if (cumulSimule !== dernierCumul || premierSimule !== dernierPremier) {
      const { maxKwh } = dessinerStructure(cumulSimule, premierSimule);
      dernierMaxKwh = maxKwh;
    }
    deplacerPoint(montantFinal, cumulSimule, premierSimule);
    majDetail(montantFinal, cumulSimule, premierSimule);
  }

  document.getElementById("sim-montant-prealable").addEventListener("input", () => {
    majAffichage(parseFloat(document.getElementById("sim-slider").value) || 10000, false);
  });
  document.getElementById("sim-slider").addEventListener("input", (e) => {
    majAffichage(parseFloat(e.target.value), false);
  });
  document.getElementById("sim-montant").addEventListener("change", () => {
    majAffichage(parseMontant(document.getElementById("sim-montant").value) || 0, false);
  });
  document.getElementById("sim-kwh").addEventListener("change", () => {
    majAffichage(parseMontant(document.getElementById("sim-kwh").value) || 0, true);
  });

  // Glisser directement sur la courbe (souris ou doigt)
  const svgEl = document.getElementById("sim-courbe");
  let enGlissement = false;
  function depuisPointeur(e) {
    const rect = svgEl.getBoundingClientRect();
    const xRatio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const xSvg = xRatio * W;
    const montant = ((xSvg - padL) / plotW) * montantMaxSlider;
    majAffichage(Math.round(Math.max(0, montant) / 100) * 100, false);
  }
  svgEl.addEventListener("pointerdown", (e) => { enGlissement = true; depuisPointeur(e); });
  window.addEventListener("pointermove", (e) => { if (enGlissement) depuisPointeur(e); });
  window.addEventListener("pointerup", () => { enGlissement = false; });

  majAffichage(10000, false);
}

// PWA service worker
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
